// base = dia normal. Los otros dos son ajustes en kcal sobre la base.
const NUTR_DEF={base:2150,alto:200,bajo:-200,prot:2.3,fat:0.85,fatMin:60};
const nutrCfg=data=>({...NUTR_DEF,...(data.nutrCfg||{})});
// Clasifica el dia: "alto" (piernas o futbol), "bajo" (sin pesas ni futbol), "normal" (resto)
const dayLoad=(data,dayName)=>{
  const sess=phSched(data,data.phase||0).find(d=>d.day===dayName);
  if(dayName==="Jueves"&&SPORT_DAYS[dayName])return "alto";
  if(sess)return sess.muscles.indexOf("legs")>=0?"alto":"normal";
  if(dayName==="Sabado")return "normal";   // sin pesas pero es la tirada larga de running
  return "bajo";
};
const LOAD_LBL={alto:{l:"Carga alta",c:"#FF6B35",i:"\u{1F525}"},normal:{l:"Normal",c:"#3498DB",i:"\u{1F3CB}\uFE0F"},bajo:{l:"Bajo",c:"#7F8C8D",i:"\u{1F634}"}};
// Devuelve {kcal,p,c,f,load} para un dia
const nutrTargets=(data,dayName,pesoKg)=>{
  const cf=nutrCfg(data), load=dayLoad(data,dayName);
  const kcal=Math.round(cf.base+(load==="alto"?cf.alto:load==="bajo"?cf.bajo:0));
  const p=Math.round(pesoKg*cf.prot);
  const f=Math.max(Math.round(pesoKg*cf.fat),cf.fatMin);
  const c=Math.max(Math.round((kcal-p*4-f*9)/4),0);
  return {kcal,p,c,f,load};
};

function tgt(hist){
  if(!hist?.length)return null;
  const last=hist.at(-1),sets=last.sets||[];
  if(!sets.length)return null;
  const avg=sets.reduce((s,x)=>s+x.reps,0)/sets.length,mw=Math.max(...sets.map(s=>s.weight));
  let tw=mw,tr=Math.round(avg),ts=sets.length,sug="";
  if(avg>=12){tw=Math.ceil((mw*1.025)/0.5)*0.5;tr=8;sug="Subir peso a "+tw+"kg. Apuntar a 8 reps."}
  else if(avg>=8){tr=Math.round(avg)+1;sug="Mantener "+mw+"kg. Apuntar a "+tr+" reps."}
  else if(avg>=6){if(sets.length<5){ts=sets.length+1;sug="Mantener "+mw+"kg x "+Math.round(avg)+" reps. +1 serie ("+ts+")."}else{tr=Math.round(avg)+1;sug="Mantener "+mw+"kg. Intentar "+tr+" reps."}}
  else{tw=Math.floor((mw*0.95)/0.5)*0.5;tr=8;sug="Reducir a "+tw+"kg para 8 reps con tecnica."}
  return{targetWeight:tw,targetReps:tr,targetSets:ts,suggestion:sug};
}

async function fileToBlock(file){

  if(isPdf)return {type:"document",source:{type:"base64",media_type:"application/pdf",data:b64}};
  let mt=file.type||"image/jpeg";

  return {type:"image",source:{type:"base64",media_type:mt,data:b64}};
}

// Cierra estructuras abiertas de un fragmento JSON, descartando tokens colgados al final
function closeFrom(str){
  const stack=[];let inStr=false,esc=false;
  for(let i=0;i<str.length;i++){const c=str[i];
    if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==='{')stack.push('}');
    else if(c==='[')stack.push(']');
    else if(c==='}'||c===']'){if(!stack.length)return null;stack.pop();}}
  let out=str;
  const ws=c=>c===' '||c==='\n'||c==='\t'||c==='\r';
  if(inStr){out+='"';}
  else{
    while(out.length&&(ws(out[out.length-1])||out[out.length-1]===','))out=out.slice(0,-1);
    // quitar "clave": colgada sin valor
    if(out.length&&out[out.length-1]===':'){
      out=out.slice(0,-1);
      while(out.length&&ws(out[out.length-1]))out=out.slice(0,-1);
      if(out.length&&out[out.length-1]==='"'){
        out=out.slice(0,-1);let e2=false;
        while(out.length){const ch=out[out.length-1];out=out.slice(0,-1);if(ch==='\\'){e2=!e2;continue;}if(ch==='"'&&!e2)break;e2=false;}
      }
      while(out.length&&(ws(out[out.length-1])||out[out.length-1]===','))out=out.slice(0,-1);
    }
  }
  for(let k=stack.length-1;k>=0;k--)out+=stack[k];
  return out;
}

// Parse JSON tolerante: limpia markdown y repara respuestas truncadas
function pj(txt){
  let s=String(txt).replace(/```json|```/g,"").trim();
  const a=s.indexOf("{");if(a>0)s=s.slice(a);
  try{return JSON.parse(s);}catch(e){}
  const isEnd=c=>c==='"'||c==='}'||c===']'||(c>='0'&&c<='9')||c==='e'||c==='l';
  for(let i=s.length;i>0;i--){
    if(i<s.length&&!isEnd(s[i-1]))continue;
    const closed=closeFrom(s.slice(0,i));
    if(closed){try{return JSON.parse(closed);}catch(e){}}
  }
  throw new Error("No se pudo interpretar la respuesta de la IA (formato inv\u00e1lido).");
}

async function callAIVision(parts,key,maxTokens){
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:maxTokens||2000,messages:[{role:"user",content:parts}]})});
  const d=await r.json();if(d.error)throw new Error(d.error.message);
  return d.content?.map(c=>c.text||"").join("")||"";
}

// ─── BODY TAB ───

  const onAnthroFile=async(e)=>{

      const txt="Analiz\u00e1 este estudio antropom\u00e9trico o de composici\u00f3n corporal (antropometr\u00eda ISAK, InBody, DEXA, balanza inteligente, etc.) y extra\u00e9 los valores que encuentres. Campos disponibles (id: etiqueta): "+fields+". Devolv\u00e9 SOLO JSON v\u00e1lido, sin markdown, sin texto antes ni despu\u00e9s:\n{\"date\":\"YYYY-MM-DD o null si no figura\",\"values\":{\"weight\":77.5,\"body_fat\":15.2}}\nEn \"values\" inclu\u00ed \u00fanicamente los campos que puedas leer con certeza, usando exactamente los ids indicados. Convert\u00ed unidades si hace falta (peso en kg, pliegues en mm, per\u00edmetros en cm). Si un dato no corresponde a ning\u00fan campo, ignoralo.";
      const resp=await callAIVision([block,{type:"text",text:txt}],apiKey,1500);
      const parsed=pj(resp);
      const nv={};
      Object.entries(parsed.values||{}).forEach(([k,v])=>{if(ANTHRO.some(f=>f.id===k)&&v!=null&&v!=="")nv[k]=String(v)});

  const onStudyFile=(e)=>{const file=e.target.files&&e.target.files[0];if(e.target)e.target.value="";if(!file)return;setStFile(file);setStResult(null);setStErr("");setStDate(td());setStView("new")};

  const analyzeStudy=async()=>{

    try{
      const block=await fileToBlock(stFile);

      const resp=await callAIVision([block,{type:"text",text:txt}],apiKey,3500);
      const parsed=pj(resp);
      setStResult(parsed);
      if(parsed.date&&typeof parsed.date==="string"&&parsed.date.length===10&&parsed.date[4]==="-")setStDate(parsed.date);
    }catch(err){setStErr("No se pudo analizar: "+err.message);}

  const saveStudy=()=>{

      {stResult.findings&&<div style={{...S.cd,marginTop:12}}><h4 style={{fontSize:12,color:"#888",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>HALLAZGOS</h4><p style={{fontSize:13,lineHeight:1.5,color:"#CCC",whiteSpace:"pre-wrap"}}>{stResult.findings}</p></div>}
      {disclaimer}
      <button onClick={saveStudy} style={{...S.btn,width:"100%",marginTop:16}}>Guardar estudio</button>
      <button onClick={analyzeStudy} disabled={stLoad} style={{...S.aset,marginTop:8}}>Reanalizar</button>

  if(stView==="detail"&&stSel){const s=(data.healthStudies||[]).find(x=>x.id===stSel);if(!s)return <div style={S.pg}><button onClick={()=>{setStView("list");setStSel(null)}} style={S.sm}>&#8592;</button><p style={{color:"#888",marginTop:16}}>Estudio no encontrado.</p></div>;const ti=STUDY_TYPES.find(t=>t.id===s.type);

    <p style={{fontSize:12,color:"#888",marginBottom:16}}>{ti?.l} \u00b7 {fd(s.date)}</p>
    {s.summary&&<div style={S.aicd}><h4 style={{fontSize:12,color:"#FF6B35",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>RESUMEN</h4><p style={{fontSize:13,lineHeight:1.5,color:"#DDD"}}>{s.summary}</p></div>}
    {s.values&&s.values.length>0&&<div style={{marginTop:12}}><h4 style={{fontSize:12,color:"#888",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>VALORES</h4>{s.values.map((v,i)=><div key={i} style={{...S.cd,padding:"10px 12px",marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:"#CCC"}}>{v.label}</span><span style={{fontSize:14,fontWeight:700,color:flagC(v.flag)}}>{v.value} {v.unit} {flagT(v.flag)&&<span style={{fontSize:11}}>{flagT(v.flag)}</span>}</span></div>{v.ref&&<span style={{fontSize:11,color:"#666"}}>Ref: {v.ref}</span>}</div>)}</div>}

  const latest=(data.anthropometry||[]).length?(data.anthropometry||[]).sort((a,b)=>b.date.localeCompare(a.date))[0]:null;

      <button onClick={()=>{setVals({});setExNote("");setDate(td());setAdding(true)}} style={{...S.aset,marginBottom:20,marginTop:0}}>+ Cargar manualmente</button>

    </div>}

      {studies.map(s=>{const ti=STUDY_TYPES.find(t=>t.id===s.type);const ab=(s.values||[]).filter(v=>v.flag==="alto"||v.flag==="bajo").length;

    </div>}
  </div>;
}

// ─── WORKOUT TAB ───
function WorkoutTab({data,setData,apiKey}){
  const[ses,setSes]=useState(null);const[sg,setSg]=useState(null);const[exQ,setExQ]=useState("");const[showFb,setShowFb]=useState(false);const[fb,setFb]=useState("");const[aiRes,setAiRes]=useState("");const[aiLoad,setAiLoad]=useState(false);
  const start=()=>{setSes({id:gi(),date:td(),exercises:[]});setSg(null);setExQ("")};
  const addEx=(name,group)=>{const hist=data.sessions.flatMap(s=>s.exercises).filter(e=>e.name===name);const t2=tgt(hist);const uni=isUni(name);const mk=()=>{const b={weight:t2?t2.targetWeight:"",reps:t2?t2.targetReps:"",done:false};return uni?{...b,repsR:t2?t2.targetReps:""}:b};setSes(s=>({...s,exercises:[...s.exercises,{id:gi(),name,muscleGroup:group,uni,sets:Array.from({length:t2?t2.targetSets:1},mk),targets:t2}]}));setSg(null);setExQ("")};
  const upSet=(eid,idx,f,v)=>setSes(s=>({...s,exercises:s.exercises.map(ex=>ex.id===eid?{...ex,sets:ex.sets.map((st,i)=>i===idx?{...st,[f]:f==="done"?v:(v===""?"":Number(v))}:st)}:ex)}));
  const addSet=(eid)=>setSes(s=>({...s,exercises:s.exercises.map(ex=>{if(ex.id!==eid)return ex;const l=ex.sets.at(-1)||{};const nx={weight:l.weight??"",reps:l.reps??"",done:false};if(ex.uni)nx.repsR=l.repsR??"";return{...ex,sets:[...ex.sets,nx]}})}));
  const rmSet=(eid,idx)=>setSes(s=>({...s,exercises:s.exercises.map(ex=>ex.id===eid?{...ex,sets:ex.sets.filter((_,i)=>i!==idx)}:ex)}));
  const rmEx=eid=>setSes(s=>({...s,exercises:s.exercises.filter(ex=>ex.id!==eid)}));
  const togEx=eid=>setSes(s=>({...s,exercises:s.exercises.map(ex=>ex.id===eid?{...ex,closed:!ex.closed}:ex)}));

    if(apiKey){try{const txt=await callAI(buildPrompt(toSave,ns,fb,data.meals),apiKey);setAiRes(txt);nd.coachNotes=[...nd.coachNotes,{sessionId:toSave.id,date:toSave.date,note:txt,feedback:fb}];nd.planNotes=[...(nd.planNotes||[]),{date:toSave.date,note:txt}]}catch(e){setAiRes("Error: "+e.message)}}
    else{setAiRes("Sin API key. Sesion guardada. Anda a Config.")}

  if(!ses){const last=data.sessions.at(-1);return <div style={S.pg}><div style={S.hero}><span style={{fontSize:48}}>{"\u{1F525}"}</span><h2 style={{fontFamily:"'Oswald',sans-serif",fontSize:22,margin:"8px 0 4px"}}>Listo para forjar?</h2><p style={{fontSize:13,color:"#AAA",margin:0}}>{last?"Ultima: "+fd(last.date):"Comenza a registrar"}</p><button onClick={start} style={{...S.btn,marginTop:16,width:"100%"}}>Iniciar sesion</button></div>{data.coachNotes.length>0&&<div style={{marginTop:20}}><h3 style={S.t1}>{"\u{1F9E0}"} Coach</h3><div style={S.aicd}><p style={{fontSize:13,lineHeight:1.5,color:"#CCC",whiteSpace:"pre-wrap"}}>{data.coachNotes.at(-1).note}</p><p style={{fontSize:11,color:"#888",marginTop:8}}>{fd(data.coachNotes.at(-1).date)}</p></div></div>}</div>}

  return <div style={S.pg}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}><h2 style={S.t1}>Sesion en curso</h2><span style={{fontSize:12,color:"#888"}}>{fd(ses.date)}</span></div>

      const uni=!!ex.uni;

      const sl=ex.sets.reduce((a2,st)=>a2+(Number(st.reps)||0),0),sr=ex.sets.reduce((a2,st)=>a2+(Number(st.repsR)||0),0);
      const vol=ex.sets.reduce((a2,st)=>a2+(Number(st.weight)||0)*setReps(st),0);
      const todas=ex.sets.length>0&&ex.sets.every(st=>st.done);
      if(ex.closed)return <div key={ex.id} style={{...S.cd,padding:"10px 14px",background:"rgba(46,204,113,0.06)",borderLeft:"3px solid #2ECC71"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
          <div style={{minWidth:0}}>
            <div style={{fontSize:14,color:"#FFF",fontWeight:600}}>{"\u2713"} {ex.name}</div>
            <div style={{fontSize:11,color:"#888",marginTop:2}}>{ex.sets.length+" series \u00b7 "+(vol>0?Math.round(vol)+" kg de volumen":"sin carga")}</div>

        </div></div>;
      return <div key={ex.id} style={S.cd}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><span style={{fontSize:12,color:MG[ex.muscleGroup]?.c,fontWeight:700}}>{MG[ex.muscleGroup]?.i} {MG[ex.muscleGroup]?.l}</span><h3 style={{margin:"4px 0 0",fontSize:16,fontFamily:"'Oswald',sans-serif",color:"#FFF"}}>{ex.name}</h3>{uni&&<div style={{fontSize:10,color:"#F39C12",fontWeight:700,marginTop:3,letterSpacing:0.5}}>{"\u2194 UNILATERAL \u2014 REPS POR LADO"}</div>}</div><button onClick={()=>rmEx(ex.id)} style={S.sm}>x</button></div>
      {ex.targets&&<div style={S.tbdg}>{"\u{1F3AF}"} {ex.targets.suggestion}</div>}
      <div style={{marginTop:12}}>
        <div style={{display:"grid",gridTemplateColumns:gt,gap:6,marginBottom:6}}><span style={S.colh}>#</span><span style={S.colh}>Kg</span><span style={S.colh}>{uni?"Izq":"Reps"}</span>{uni&&<span style={S.colh}>Der</span>}<span style={S.colh}>Ok</span><span></span></div>
        {ex.sets.map((set,idx)=><div key={idx} style={{display:"grid",gridTemplateColumns:gt,gap:6,alignItems:"center",marginBottom:4,opacity:set.done?0.6:1}}>
          <span style={{fontSize:13,color:"#888",textAlign:"center"}}>{idx+1}</span>
          <input type="number" inputMode="decimal" placeholder="0" value={set.weight} onFocus={e=>e.target.select()} onChange={e=>upSet(ex.id,idx,"weight",e.target.value)} style={S.inp} step="0.5"/>
          <input type="number" inputMode="numeric" placeholder="0" value={set.reps} onFocus={e=>e.target.select()} onChange={e=>upSet(ex.id,idx,"reps",e.target.value)} style={S.inp}/>
          {uni&&<input type="number" inputMode="numeric" placeholder="0" value={set.repsR===undefined?"":set.repsR} onFocus={e=>e.target.select()} onChange={e=>upSet(ex.id,idx,"repsR",e.target.value)} style={S.inp}/>}
          <button onClick={()=>upSet(ex.id,idx,"done",!set.done)} style={{...S.chk,background:set.done?"#2ECC71":"rgba(255,255,255,0.05)",color:set.done?"#FFF":"#666"}}>&#10003;</button>
          <button onClick={()=>rmSet(ex.id,idx)} style={S.sm}>-</button>
        </div>)}
        <div style={{display:"flex",gap:8,marginTop:6}}>
          <button onClick={()=>addSet(ex.id)} style={{...S.aset,flex:1,marginTop:0}}>+ Serie</button>
          <button onClick={()=>togEx(ex.id)} style={{...S.aset,flex:1,marginTop:0,borderStyle:"solid",borderColor:todas?"#2ECC71":"rgba(255,255,255,0.12)",color:todas?"#2ECC71":"#888",fontWeight:todas?700:400}}>{"\u2713 Listo"}</button>
        </div>
        {uni&&ex.sets.length>0&&<div style={{fontSize:11,color:"#888",marginTop:8,textAlign:"center",lineHeight:1.5}}>{ex.sets.length+" series \u00b7 "+sl+" reps izq / "+sr+" der"}<br/><span style={{color:"#FF6B35",fontWeight:600}}>{(sl+sr)+" repeticiones totales"}</span></div>}
      </div></div>;
    })}
    {!sg?<div><h3 style={{...S.t1,fontSize:14,marginTop:20}}>Agregar ejercicio</h3><div style={S.mg2}>{Object.entries(MG).map(([k,v])=><button key={k} onClick={()=>setSg(k)} style={S.mb2}><span style={{fontSize:22}}>{v.i}</span><span style={{fontSize:11,color:v.c,fontWeight:600}}>{v.l}</span></button>)}</div></div>:<div><div style={{display:"flex",alignItems:"center",gap:8,marginTop:16,marginBottom:8}}><button onClick={()=>setSg(null)} style={S.sm}>&#8592;</button><h3 style={{fontSize:14,color:MG[sg].c,margin:0,fontFamily:"'Oswald',sans-serif"}}>{MG[sg].i} {MG[sg].l}</h3></div><input value={exQ} onChange={e=>setExQ(e.target.value)} placeholder="Buscar o escribir un ejercicio nuevo..." style={{...S.inp,marginBottom:8}}/><div style={{display:"flex",flexDirection:"column",gap:4}}>{(EC[sg]||[]).filter(n=>!exQ.trim()||n.toLowerCase().includes(exQ.trim().toLowerCase())).map(n=><button key={n} onClick={()=>addEx(n,sg)} style={S.eo}>{n}</button>)}{exQ.trim()&&!(EC[sg]||[]).some(n=>n.toLowerCase()===exQ.trim().toLowerCase())&&<button onClick={()=>addEx(exQ.trim(),sg)} style={{...S.eo,borderColor:MG[sg].c+"66",color:MG[sg].c}}>{"+ Agregar \""+exQ.trim()+"\""}</button>}</div></div>}
    {ses.exercises.length>0&&<button onClick={()=>setShowFb(true)} style={{...S.btn,marginTop:24,width:"100%"}}>Finalizar {"\u{1F525}"}</button>}
  </div>;
}

// ─── PROGRESS TAB ───
function ProgressTab({data}){
  const[sg,setSg]=useState(null);const[se,setSe]=useState(null);
  const gs={};Object.keys(MG).forEach(g=>{gs[g]={sc:new Set(data.sessions.filter(s=>s.exercises.some(e=>e.muscleGroup===g)).map(s=>s.id)).size}});
  if(se&&sg){const hist=data.sessions.flatMap(s=>s.exercises.filter(e=>e.name===se).map(e=>({...e,date:s.date}))).sort((a,b)=>a.date.localeCompare(b.date));const cd2=hist.map(h=>({date:h.date,mw:Math.max(...h.sets.map(s=>s.weight))}));const pk=cd2.length?Math.max(...cd2.map(h=>h.mw)):0;
    return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setSe(null)} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0}}>{se}</h2></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}><div style={S.stc}><span style={S.stv}>{pk}<span style={S.stu}>kg</span></span><span style={S.stl}>Peso max</span></div><div style={S.stc}><span style={S.stv}>{hist.length}</span><span style={S.stl}>Sesiones</span></div></div>{cd2.length>1&&<div style={S.cd}><h4 style={{fontSize:13,color:"#888",margin:"0 0 12px",fontFamily:"'Oswald',sans-serif"}}>PROGRESION</h4><div style={{display:"flex",alignItems:"flex-end",gap:4,height:120}}>{cd2.map((h,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:10,color:"#AAA"}}>{h.mw}</span><div style={{width:"100%",height:(pk>0?(h.mw/pk)*100:10)+"%",minHeight:4,background:"linear-gradient(180deg,#FF6B35,#D62828)",borderRadius:4}}/><span style={{fontSize:8,color:"#666"}}>{h.date.slice(5)}</span></div>)}</div></div>}{hist.map((h,i)=><div key={i} style={{...S.cd,padding:12}}><div style={{fontSize:12,color:"#888",marginBottom:6}}>{fd(h.date)}</div>{h.sets.map((s2,j)=><div key={j} style={{fontSize:13,color:"#CCC",display:"flex",gap:8}}><span style={{color:"#888",width:28}}>S{j+1}</span><span style={{color:"#FF6B35",fontWeight:700,width:50}}>{s2.weight}kg</span><span>x {s2.repsR===undefined?s2.reps:(s2.reps+" izq / "+s2.repsR+" der")}</span></div>)}</div>)}</div>}
  if(sg){const names=[...new Set(data.sessions.flatMap(s=>s.exercises.filter(e=>e.muscleGroup===sg).map(e=>e.name)))];return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setSg(null)} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0,color:MG[sg].c}}>{MG[sg].i} {MG[sg].l}</h2></div>{names.length===0?<p style={{color:"#888",textAlign:"center"}}>Sin ejercicios.</p>:names.map(n=>{const h=data.sessions.flatMap(s=>s.exercises.filter(e=>e.name===n));const mw=Math.max(...h.flatMap(x=>x.sets.map(s=>s.weight)),0);return <button key={n} onClick={()=>setSe(n)} style={S.eo}><span>{n}</span><span style={{color:"#FF6B35",fontSize:13,fontWeight:700}}>{mw}kg - {h.length}</span></button>})}</div>}
  const ts=data.sessions.length,tv=data.sessions.reduce((sum,s)=>sum+s.exercises.reduce((s2,ex)=>s2+ex.sets.reduce((s3,st)=>s3+(Number(st.weight)||0)*setReps(st),0),0),0);

}

// ─── SETTINGS ───
function SettingsTab({apiKey,onApiKeyChange,data,setData}){
  const[k,setK]=useState(apiKey);const[saved,setSaved]=useState(false);
  const doSave=()=>{onApiKeyChange(k);setSaved(true);setTimeout(()=>setSaved(false),2000)};
  const cf=nutrCfg(data);
  const pesoAct=data.anthropometry?.length?(data.anthropometry.slice().sort((a,b)=>b.date.localeCompare(a.date))[0].weight||77.7):77.7;
  const setCf=(campo,val)=>{const nd={...data,nutrCfg:{...(data.nutrCfg||{}),[campo]:val===""?NUTR_DEF[campo]:Number(val)}};setData(nd);sv(nd)};
  const resetCf=()=>{const nd={...data};delete nd.nutrCfg;setData(nd);sv(nd)};
  const fila=(campo,etiqueta,ayuda,sufijo)=><div style={{marginBottom:12}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline"}}>
      <span style={{fontSize:12.5,color:"#FFF",fontWeight:600}}>{etiqueta}</span>
      <span style={{fontSize:10,color:"#666"}}>{sufijo}</span></div>
    <input type="number" inputMode="decimal" value={cf[campo]} onFocus={e=>e.target.select()} onChange={e=>setCf(campo,e.target.value)} style={{...S.inp,marginTop:4}} step="any"/>
    <div style={{fontSize:10.5,color:"#777",marginTop:3,lineHeight:1.4}}>{ayuda}</div>
  </div>;
  const prev=["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado","Domingo"].map(d=>({d,...nutrTargets(data,d,pesoAct)}));
  const prom=Math.round(prev.reduce((a,x)=>a+x.kcal,0)/7);
  const[impMsg,setImpMsg]=useState(null);
  const[gd,setGd]=useState(GD.cfg());
  const[gdMsg,setGdMsg]=useState(null);
  const[gdBusy,setGdBusy]=useState(false);
  const gdRun=async(fn,okTxt)=>{
    setGdBusy(true);setGdMsg(null);
    try{await fn();setGd(GD.cfg());setGdMsg({ok:true,t:okTxt})}
    catch(e){setGdMsg({ok:false,t:e.message||"Fall\u00f3 la sincronizaci\u00f3n"})}
    setGdBusy(false);
  };
  const gdConnect=()=>gdRun(async()=>{await GD.getToken();await GD.push(data)},"Conectado. Tus datos ya est\u00e1n en Drive.");
  const gdPush=()=>gdRun(()=>GD.push(data),"Subido a Drive.");
  const gdPull=()=>gdRun(async()=>{
    const nd=await GD.pull();
    const st=bkStats(nd);
    const resumen=Object.keys(st).map(k=>st[k]+" "+k.toLowerCase()).join(", ");
    if(!window.confirm("En Drive hay: "+resumen+".\n\nEsto REEMPLAZA los datos de este dispositivo. \u00bfSeguir?"))throw new Error("Cancelado");
    sv(nd);setData(nd);setTimeout(()=>window.location.reload(),900);
  },"Datos tra\u00eddos de Drive. Recargando...");
  const gdOff=()=>{if(window.confirm("Se corta la sincronizaci\u00f3n en este dispositivo. El archivo de Drive queda como est\u00e1. \u00bfSeguir?")){GD.clear();setGd({});setGdMsg(null)}};
  const stats=bkStats(data);
  const doImport=ev=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const nd=bkParse(String(rd.result));
        const st=bkStats(nd);
        const resumen=Object.keys(st).map(k=>st[k]+" "+k.toLowerCase()).join(", ");
        if(window.confirm("El backup contiene: "+resumen+".\n\nEsto REEMPLAZA todos los datos actuales de este dispositivo. \u00bfSeguir?")){
          sv(nd);setData(nd);setImpMsg({ok:true,t:"Datos restaurados. Recargando..."});
          setTimeout(()=>window.location.reload(),1200);
        }
      }catch(e){setImpMsg({ok:false,t:"No se pudo leer: "+e.message})}
    };
    rd.onerror=()=>setImpMsg({ok:false,t:"No se pudo leer el archivo"});
    rd.readAsText(f);ev.target.value="";
  };
  return <div style={S.pg}><h2 style={S.t1}>{"\u2699\uFE0F"} Config</h2><div style={S.cd}><h3 style={{fontSize:14,color:"#FF6B35",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>API Key de Anthropic</h3><p style={{fontSize:12,color:"#888",marginBottom:12,lineHeight:1.5}}>Para el Coach IA. Solo se guarda en tu dispositivo. <a href="https://console.anthropic.com" target="_blank" rel="noopener" style={{color:"#FF6B35"}}>console.anthropic.com</a></p><input type="password" value={k} onChange={e=>setK(e.target.value)} placeholder="sk-ant-api..." style={{...S.inp,marginBottom:12}}/><button onClick={doSave} style={{...S.btn,width:"100%"}}>{saved?"Guardada!":"Guardar"}</button></div><div style={{...S.cd,marginTop:16}}>
    <h3 style={{fontSize:14,color:"#2ECC71",margin:"0 0 4px",fontFamily:"'Oswald',sans-serif"}}>Objetivos nutricionales</h3>
    <p style={{fontSize:11,color:"#888",marginBottom:14,lineHeight:1.5}}>Las calor\u00edas se ajustan solas seg\u00fan lo que toca entrenar cada d\u00eda. Ac\u00e1 mov\u00e9s la base cuando cambies de bloque (d\u00e9ficit, mantenimiento, diet break).</p>
    {fila("base","Calor\u00edas base","D\u00eda normal: sesi\u00f3n de tren superior o s\u00e1bado.","kcal")}
    {fila("alto","Ajuste d\u00eda de carga alta","Se suma a la base los d\u00edas de piernas y el jueves de f\u00fatbol.","+kcal")}

        <span style={{fontSize:11,color:"#777"}}>{x.p}P {"\u00b7"} {x.c}C {"\u00b7"} {x.f}G</span>

        <span style={{fontSize:13,color:"#FF6B35",fontWeight:700}}>{prom} kcal</span></div>
    </div>
    <button onClick={resetCf} style={{...S.aset,marginTop:10}}>Restaurar valores por defecto</button>
  </div>
  <div style={{...S.cd,marginTop:16}}>
    <h3 style={{fontSize:14,color:"#4285F4",margin:"0 0 4px",fontFamily:"'Oswald',sans-serif"}}>Sincronizaci\u00f3n con Google Drive</h3>
    <p style={{fontSize:11,color:"#888",marginBottom:12,lineHeight:1.5}}>Guarda un archivo <b>forja-data.json</b> en tu Drive y lo mantiene al d\u00eda. As\u00ed ves los mismos datos en el tel\u00e9fono y en la computadora. FORJA solo puede tocar ese archivo: el resto de tu Drive le queda invisible.</p>
    {gd.auto
      ? <div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:"rgba(66,133,244,0.08)",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
            <span style={{width:8,height:8,borderRadius:4,background:"#2ECC71",flexShrink:0}}></span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:12.5,color:"#FFF",fontWeight:600}}>Sincronizaci\u00f3n activa</div>
              <div style={{fontSize:10.5,color:"#888",marginTop:2}}>{gd.last?"\u00daltima vez: "+new Date(gd.last).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"Sin sincronizar todav\u00eda"}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={gdPush} disabled={gdBusy} style={{...S.aset,flex:1,marginTop:0,borderStyle:"solid",opacity:gdBusy?0.5:1}}>{"\u2191 Subir ahora"}</button>
            <button onClick={gdPull} disabled={gdBusy} style={{...S.aset,flex:1,marginTop:0,borderStyle:"solid",opacity:gdBusy?0.5:1}}>{"\u2193 Traer de Drive"}</button>
          </div>
          <button onClick={gdOff} style={{...S.aset,marginTop:8,color:"#777"}}>Desconectar este dispositivo</button>
        </div>
      : <button onClick={gdConnect} disabled={gdBusy} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#4285F4,#2B62C7)",opacity:gdBusy?0.6:1}}>{gdBusy?"Conectando...":"Conectar con Google Drive"}</button>}
    {gdMsg&&<p style={{fontSize:11.5,color:gdMsg.ok?"#2ECC71":"#E74C3C",marginTop:10,marginBottom:0,lineHeight:1.5}}>{gdMsg.t}</p>}
    <p style={{fontSize:10.5,color:"#777",marginTop:10,marginBottom:0,lineHeight:1.5}}>Con la sync activa, cada cambio se sube solo unos segundos despu\u00e9s. Si edit\u00e1s en dos dispositivos sin sincronizar en el medio, gana el \u00faltimo que guarda.</p>
  </div>
  <div style={{...S.cd,marginTop:16}}>
    <h3 style={{fontSize:14,color:"#3498DB",margin:"0 0 4px",fontFamily:"'Oswald',sans-serif"}}>Copia de seguridad</h3>
    <p style={{fontSize:11,color:"#888",marginBottom:12,lineHeight:1.5}}>Tus datos viven solo en este dispositivo: no se sincronizan con la computadora ni con otro navegador. Export\u00e1 cada tanto y guard\u00e1 el archivo donde quieras.</p>
    <div style={{background:"rgba(255,255,255,0.03)",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
      <div style={{fontSize:11,color:"#888",letterSpacing:1,fontWeight:600,marginBottom:8}}>LO QUE HAY GUARDADO</div>

        <span style={{fontSize:12,color:"#CCC"}}>{k}</span>
        <span style={{fontSize:12,color:stats[k]>0?"#FFF":"#555",fontWeight:600}}>{stats[k]}</span></div>)}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8,paddingTop:8,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
        <span style={{fontSize:11,color:"#666"}}>Tama\u00f1o</span>
        <span style={{fontSize:11,color:"#666"}}>{bkSize()} KB de ~5.000 disponibles</span></div>
    </div>
    <button onClick={()=>bkExport(data)} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#3498DB,#2471A3)"}}>{"\u2193"} Exportar backup</button>
    <label style={{...S.aset,marginTop:10,display:"block",textAlign:"center",lineHeight:"20px"}}>
      {"\u2191 Importar backup"}
      <input type="file" accept="application/json,.json" onChange={doImport} style={{display:"none"}}/>
    </label>
    {impMsg&&<p style={{fontSize:11.5,color:impMsg.ok?"#2ECC71":"#E74C3C",marginTop:10,marginBottom:0}}>{impMsg.t}</p>}
    <p style={{fontSize:10.5,color:"#777",marginTop:10,marginBottom:0,lineHeight:1.5}}>Importar <b>reemplaza</b> todo lo que tengas en este dispositivo. Si ten\u00e9s algo que no quer\u00e9s perder, export\u00e1 primero.</p>
  </div>
  <div style={{...S.cd,marginTop:16}}><h3 style={{fontSize:14,color:"#E74C3C",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>Borrar datos</h3><button onClick={()=>{if(window.confirm("Seguro? Se borran TODOS los datos.")){localStorage.removeItem(SK);window.location.reload()}}} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#E74C3C,#C0392B)"}}>Borrar todo</button></div></div>;
}

// ─── APP ───
function App(){
  const[data,setData]=useState(EMPTY);const[tab,setTab]=useState("today");const[loading,setLoading]=useState(true);const[apiKey,setAK]=useState("");
  useEffect(()=>{const d=ld();if(d){if(!d.anthropometry)d.anthropometry=[];if(d.phase===undefined)d.phase=0;if(!d.planNotes)d.planNotes=[];if(!d.cardioSessions)d.cardioSessions=[];if(!d.coachNotes)d.coachNotes=[];if(!d.meals)d.meals=[];if(!d.weeklyNutrPlan)d.weeklyNutrPlan=null;if(!d.healthStudies)d.healthStudies=[];setData(d)}setAK(gk());setLoading(false)},[]);
  // Si la sync esta activa, avisa cuando Drive tiene algo mas nuevo que este dispositivo
  const[gdNuevo,setGdNuevo]=useState(false);
  useEffect(()=>{
    if(loading||!GD.cfg().auto)return;
    let vivo=true;
    const t=setTimeout(async()=>{
      try{
        const rt=await GD.remoteTime();
        const local=GD.cfg().last;
        if(vivo&&rt&&local&&new Date(rt).getTime()>new Date(local).getTime()+5000)setGdNuevo(true);
      }catch(e){}
    },2500);
    return ()=>{vivo=false;clearTimeout(t)};
  },[loading]);
  const traerDeDrive=async()=>{
    try{
      const nd=await GD.pull();
      const st=bkStats(nd);
      const resumen=Object.keys(st).map(k=>st[k]+" "+k.toLowerCase()).join(", ");
      if(window.confirm("En Drive hay: "+resumen+".\n\nEsto REEMPLAZA los datos de este dispositivo. \u00bfSeguir?")){
        sv(nd);setData(nd);window.location.reload();
      }else setGdNuevo(false);
    }catch(e){window.alert("No se pudo traer de Drive: "+(e.message||""));setGdNuevo(false)}
  };
  const handleKey=k=>{setAK(k);stk(k)};
  if(loading)return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0A0A0B"}}><Logo size={64}/><h1 style={{fontFamily:"'Oswald',sans-serif",fontSize:28,color:"#FFF",margin:"16px 0 0"}}>FORJA</h1></div>;
  return <div style={S.app}>
    {gdNuevo&&<div style={{position:"sticky",top:0,zIndex:90,background:"linear-gradient(135deg,#4285F4,#2B62C7)",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
      <span style={{fontSize:12,color:"#FFF",lineHeight:1.4}}>Hay datos m\u00e1s nuevos en Drive</span>
      <span style={{display:"flex",gap:6,flexShrink:0}}>
        <button onClick={traerDeDrive} style={{background:"rgba(255,255,255,0.9)",color:"#2B62C7",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Traer</button>
        <button onClick={()=>setGdNuevo(false)} style={{background:"none",color:"rgba(255,255,255,0.85)",border:"none",fontSize:16,cursor:"pointer",padding:"0 4px"}}>{"\u00d7"}</button>
      </span>
    </div>}
    <div style={S.hdr}><div style={{display:"flex",alignItems:"center",gap:10}}><Logo size={32}/><span style={{fontFamily:"'Oswald',sans-serif",fontSize:22,fontWeight:700,letterSpacing:3,color:"#FFF"}}>FORJA</span></div><span style={{fontSize:10,color:"#666",fontFamily:"'Oswald',sans-serif",letterSpacing:2}}>ENTRENA CON CIENCIA</span></div>
    <div style={S.cnt}>
      {tab==="today"&&<TodayTab data={data} onGo={setTab}/>}
      {tab==="plan"&&<PlanTab data={data} setData={setData}/>}
      {tab==="workout"&&<WorkoutTab data={data} setData={setData} apiKey={apiKey}/>}
      {tab==="cardio"&&<CardioTab data={data} setData={setData}/>}
      {tab==="nutrition"&&<NutritionTab data={data} setData={setData} apiKey={apiKey}/>}
      {tab==="body"&&<BodyTab data={data} setData={setData} apiKey={apiKey}/>}
      {tab==="progress"&&<ProgressTab data={data}/>}
      {tab==="settings"&&<SettingsTab apiKey={apiKey} onApiKeyChange={handleKey} data={data} setData={setData}/>}
    </div>
    <TabBar active={tab} onChange={setTab}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
