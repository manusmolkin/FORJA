// texto -> minusculas, sin acentos, sin puntuacion
const normLbl=t=>{
  const x=String(t||"").toLowerCase().normalize("NFD");
  let o="";
  for(const ch of x){
    const c=ch.charCodeAt(0);
    if(c>=768&&c<=879)continue;
    o+=((ch>="a"&&ch<="z")||(ch>="0"&&ch<="9"))?ch:" ";
  }
  return " "+o.split(" ").filter(Boolean).join(" ")+" ";
};
// Pares [alias, id] ordenados de mas largo a mas corto, para que gane el mas especifico
const ALIAS_PARES=(()=>{const out=[];Object.keys(ANTHRO_ALIAS).forEach(id=>ANTHRO_ALIAS[id].forEach(a=>out.push([" "+a+" ",id])));return out.sort((x,y)=>y[0].length-x[0].length)})();
// palabras que no aportan a la identificacion
const TOK_STOP=["de","del","la","el","los","las","en","por","y","a","tabla","texto","valor","valores","medida","medido","total","estimado","estimada","seccion","individual","promedio"];
const toks=t=>normLbl(t).split(" ").filter(w=>w&&TOK_STOP.indexOf(w)<0);
// ¿la unidad es compatible con el campo?
const unidadOk=(f,unit)=>{
  const u=String(unit||"").trim();
  const esPct=u.indexOf("%")>=0;
  if(esPct)return f.u==="%";
  if(f.u==="%"&&u!=="")return false;
  if(!u)return true;
  const eq={kg:"kg",g:"kg",kgs:"kg",cm:"cm",mm:"mm",kcal:"kcal"};
  const nu=eq[u.toLowerCase()]||u.toLowerCase();
  if(f.u&&["kg","cm","mm","kcal"].indexOf(f.u)>=0&&["kg","cm","mm","kcal"].indexOf(nu)>=0)return f.u===nu;
  return true;
};
// 2do intento: parecido por palabras clave, cuando no hay frase exacta
const idPorSimilitud=(label,unit)=>{
  const L=toks(label); if(!L.length)return null;
  let mejor=null, puntaje=0;
  ANTHRO.forEach(f=>{
    if(!unidadOk(f,unit))return;
    [f.l].concat(ANTHRO_ALIAS[f.id]||[]).forEach(c=>{
      const C=toks(c); if(!C.length)return;
      let hit=0; C.forEach(w=>{if(L.indexOf(w)>=0)hit++});
      if(!hit)return;
      const cobertura=hit/C.length;                    // cuanto del alias aparece
      const precision=hit/L.length;                    // cuanto de la etiqueta se usa
      if(cobertura<0.75)return;                        // exigimos casi todas las palabras del alias
      const sc=cobertura*0.7+precision*0.3;
      if(sc>puntaje){puntaje=sc;mejor=f.id}
    });
  });
  return puntaje>=0.55?mejor:null;
};
const idPorEtiqueta=(label,unit)=>{
  const l=normLbl(label);
  for(const [a,id] of ALIAS_PARES){
    if(l.indexOf(a)<0)continue;
    const f=ANTHRO.find(x=>x.id===id);
    if(f&&unidadOk(f,unit))return id;
  }
  return idPorSimilitud(label,unit);
};
// Reparte los extras en los campos conocidos. Devuelve {vals, extras, movidos}
const repartirExtras=(vals,extras)=>{
  const v={...vals}, sobran=[]; let movidos=0;
  extras.forEach(x=>{
    const num0=Number(String(x.value).replace(",","."));
    // filas de tabla de referencia ("Suma de pliegues - rango Alto: 71-90"): la app ya las tiene
    if(isNaN(num0)&&normLbl(x.label).indexOf(" rango ")>=0)return;
    const id=idPorEtiqueta(x.label,x.unit);
    const num=Number(String(x.value).replace(",","."));
    if(id&&!isNaN(num)&&String(x.value).trim()!==""){
      if(v[id]===undefined||v[id]===""){v[id]=String(num);movidos++;return}
      const prev=Number(String(v[id]).replace(",","."));
      if(!isNaN(prev)&&prev!==0&&Math.abs(num-prev)/Math.abs(prev)<0.05)return; // duplicado, se descarta
    }
    sobran.push(x);
  });
  return {vals:v,extras:sobran,movidos};
};
// Completa lo que se puede calcular a partir de lo que ya hay
const derivarAnthro=v=>{
  const n=k=>{const x=Number(String(v[k]).replace(",","."));return isNaN(x)?null:x};
  const o={...v}; let calc=0;
  const set=(k,val)=>{if((o[k]===undefined||o[k]==="")&&val!=null&&isFinite(val)){o[k]=String(Math.round(val*10)/10);calc++}};
  const P=n("weight"), H=n("height");
  if(P&&H)set("bmi",P/Math.pow(H/100,2));
  // masa <-> porcentaje, en los dos sentidos, para cada componente
  [["fat_mass","body_fat"],["muscle_mass","muscle_pct"],["bone_mass","bone_pct"],["residual_mass","residual_pct"],["skin_mass","skin_pct"]].forEach(par=>{
    const kg=n(par[0]), pc=n(par[1]);
    if(P&&pc!=null&&kg==null)set(par[0],P*pc/100);
    if(P&&kg!=null&&pc==null)set(par[1],kg/P*100);
  });
  const GM=Number(String(o.fat_mass).replace(",","."));
  if(P&&!isNaN(GM))set("lean_mass",P-GM);
  // metabolismo basal por Katch-McArdle, que usa masa magra
  const ML=Number(String(o.lean_mass).replace(",","."));
  if(!isNaN(ML)&&ML>0)set("bmr",370+21.6*ML);
  return {vals:o,calc};
};

const phaseWeeks=()=>{const out=[];let acc=0;PHASES.forEach((p,i)=>{const t=String(p.wk).split("-");const fin=p.wk.indexOf("+")>=0?null:Number(t[1]||t[0]);out.push({i,desde:acc+1,hasta:fin});acc=fin||acc});return out};

// Clasifica el dia: "alto" (piernas o futbol), "bajo" (sin pesas ni futbol), "normal" (resto)
const dayLoad=(data,dayName)=>{
  const sess=phSched(data,data.phase||0).find(d=>d.day===dayName);
  if(dayName==="Jueves"&&SPORT_DAYS[dayName])return "alto";
  if(sess)return sess.muscles.indexOf("legs")>=0?"alto":"normal";

};

// Devuelve {kcal,p,c,f,load} para un dia
const nutrTargets=(data,dayName,pesoKg)=>{
  const cf=nutrCfg(data), load=dayLoad(data,dayName), bl=nblock(data);
  const kcal=Math.round(cf.base+bl.ajuste+(load==="alto"?cf.alto:load==="bajo"?cf.bajo:0));
  const p=Math.round(pesoKg*cf.prot);
  const f=Math.max(Math.round(pesoKg*cf.fat),cf.fatMin);
  const c=Math.max(Math.round((kcal-p*4-f*9)/4),0);
  return {kcal,p,c,f,load};
};

  if(!sets.length)return null;
  const avg=sets.reduce((s,x)=>s+x.reps,0)/sets.length,mw=Math.max(...sets.map(s=>s.weight));
  let tw=mw,tr=Math.round(avg),ts=sets.length,sug="";
  if(avg>=12){tw=Math.ceil((mw*1.025)/0.5)*0.5;tr=8;sug="Subir peso a "+tw+"kg. Apuntar a 8 reps."}

  return {type:"image",source:{type:"base64",media_type:mt,data:b64}};

// Cierra estructuras abiertas de un fragmento JSON, descartando tokens colgados al final
function closeFrom(str){
  const stack=[];let inStr=false,esc=false;
  for(let i=0;i<str.length;i++){const c=str[i];
    if(inStr){if(esc)esc=false;else if(c==='\\')esc=true;else if(c==='"')inStr=false;continue;}
    if(c==='"'){inStr=true;continue;}
    if(c==='{')stack.push('}');
    else if(c==='[')stack.push(']');
    else if(c==='}'||c===']'){if(!stack.length)return null;stack.pop();}}
  let out=str;
  const ws=c=>c===' '||c==='\n'||c==='\t'||c==='\r';
  if(inStr){out+='"';}
  else{
    while(out.length&&(ws(out[out.length-1])||out[out.length-1]===','))out=out.slice(0,-1);
    // quitar "clave": colgada sin valor
    if(out.length&&out[out.length-1]===':'){
      out=out.slice(0,-1);
      while(out.length&&ws(out[out.length-1]))out=out.slice(0,-1);
      if(out.length&&out[out.length-1]==='"'){
        out=out.slice(0,-1);let e2=false;
        while(out.length){const ch=out[out.length-1];out=out.slice(0,-1);if(ch==='\\'){e2=!e2;continue;}if(ch==='"'&&!e2)break;e2=false;}
      }
      while(out.length&&(ws(out[out.length-1])||out[out.length-1]===','))out=out.slice(0,-1);
    }
  }
  for(let k=stack.length-1;k>=0;k--)out+=stack[k];
  return out;
}

// Parse JSON tolerante: limpia markdown y repara respuestas truncadas
function pj(txt){
  let s=String(txt).replace(/```json|```/g,"").trim();
  const a=s.indexOf("{");if(a>0)s=s.slice(a);
  try{return JSON.parse(s);}catch(e){}
  const isEnd=c=>c==='"'||c==='}'||c===']'||(c>='0'&&c<='9')||c==='e'||c==='l';
  for(let i=s.length;i>0;i--){
    if(i<s.length&&!isEnd(s[i-1]))continue;
    const closed=closeFrom(s.slice(0,i));
    if(closed){try{return JSON.parse(closed);}catch(e){}}
  }
  throw new Error("No se pudo interpretar la respuesta de la IA (formato inválido).");
}

function TodayTab({data,onGo}){
  const pi=data.phase||0, ph=PHASES[pi];
  const sched=phSched(data,pi);
  const hoyIdx=(new Date().getDay()+6)%7;            // 0 = Lunes
  const[sel,setSel]=useState(hoyIdx);
  const dayName=WEEKDAYS[sel];
  const sess=sched.find(d=>d.day===dayName)||null;
  const esHoy=sel===hoyIdx;
  const sport=SPORT_DAYS[dayName];
  const coreCasa=!sess&&CORE_DAYS.indexOf(dayName)>=0;
  const porciones=sess?[...new Set(sess.exercises.map(e=>EXP[e.n]).filter(Boolean))]:[];
  const fecha=new Date();fecha.setDate(fecha.getDate()+(sel-hoyIdx));
  const tipo=sess?{t:sess.name,c:ph.c,i:"\u{1F3CB}️",s:"Gimnasio"}
    :sport?{t:sport.split(" ").slice(1).join(" "),c:"#F39C12",i:sport.split(" ")[0],s:"Deporte"}
    :coreCasa?{t:"Core en casa",c:"#3E9A8C",i:"\u{1F3E0}",s:"8-10 min, sin equipo"}
    :{t:"Descanso",c:"#666",i:"\u{1F634}",s:"Recuperación"};
  return <div style={S.pg}>
    <h2 style={S.t1}>{esHoy?"Hoy":dayName}</h2>
    <div style={{display:"flex",gap:5,marginBottom:16}}>
      {WEEKDAYS.map((d,i)=>{
        const tiene=sched.some(x=>x.day===d);
        const act=i===sel;
        return <button key={d} onClick={()=>setSel(i)} style={{flex:1,minWidth:0,padding:"8px 0",borderRadius:8,border:i===hoyIdx?"1px solid #FF6B35":"1px solid rgba(255,255,255,0.08)",
          background:act?(tiene?ph.c+"33":"rgba(255,255,255,0.08)"):"rgba(255,255,255,0.03)",cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:3}}>
          <span style={{fontSize:10,color:act?"#FFF":"#888",fontWeight:act?700:400}}>{d.slice(0,3)}</span>
          <span style={{width:6,height:6,borderRadius:3,background:tiene?ph.c:(SPORT_DAYS[d]?"#F39C12":(CORE_DAYS.indexOf(d)>=0?"#3E9A8C":"#333"))}}></span>
        </button>;
      })}
    </div>
    <div style={{...S.cd,borderLeft:"3px solid "+tipo.c,background:"linear-gradient(135deg,"+tipo.c+"18,"+tipo.c+"05)"}}>
      <div style={{fontSize:11,color:"#888",letterSpacing:1.5,fontWeight:600}}>{tipo.s.toUpperCase()}</div>
      <div style={{display:"flex",alignItems:"center",gap:10,marginTop:6}}>
        <span style={{fontSize:30}}>{tipo.i}</span>
        <h3 style={{fontFamily:"'Oswald',sans-serif",fontSize:19,color:tipo.c,margin:0,lineHeight:1.2}}>{tipo.t}</h3>
      </div>
      <div style={{fontSize:11,color:"#777",marginTop:8}}>{fecha.toLocaleDateString("es-AR",{day:"numeric",month:"long"})} {"·"} {ph.ic} {ph.name}</div>
    </div>
    {sess&&<div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:10}}>{sess.muscles.map(g=><span key={g} style={{fontSize:10,padding:"3px 9px",borderRadius:10,background:MG[g]?.c+"22",color:MG[g]?.c,fontWeight:600}}>{MG[g]?.i} {MG[g]?.l}</span>)}</div>
      {porciones.length>0&&<div style={{...S.cd,padding:"12px 14px"}}>
        <div style={{fontSize:11,color:"#888",letterSpacing:1.2,fontWeight:600,marginBottom:8}}>PORCIONES QUE TOCÁS HOY</div>
        {porciones.map(x=><div key={x} style={{fontSize:12.5,color:"#CCC",padding:"3px 0"}}>{"•"} {x}</div>)}
      </div>}
      <button onClick={()=>onGo("train","pesas")} style={{...S.btn,marginTop:4,width:"100%"}}>Empezar entreno {"→"}</button>
      <h3 style={{...S.t1,fontSize:14,marginTop:18}}>Los {sess.exercises.length} ejercicios</h3>
      {sess.exercises.map((e,i)=><div key={i} style={{...S.cd,padding:"9px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
          <div style={{minWidth:0}}><div style={{fontSize:13.5,color:"#FFF",fontWeight:600}}>{i+1}. {e.n}</div>
          {EXP[e.n]&&<div style={{fontSize:10.5,color:"#7A7A7A",marginTop:2}}>{EXP[e.n]}</div>}</div>
          <span style={{fontSize:12,color:"#FF6B35",fontWeight:700,whiteSpace:"nowrap"}}>{e.s} x {e.r}</span>
        </div>
        {e.note&&<div style={{fontSize:11,color:"#999",marginTop:5,fontStyle:"italic"}}>{e.note}</div>}
      </div>)}
    </div>}
    {coreCasa&&<div>
      <div style={{...S.cd,borderLeft:"3px solid #3E9A8C",background:"rgba(62,154,140,0.06)"}}>
        <p style={{fontSize:12,color:"#CCC",lineHeight:1.6,margin:0}}>Sin gimnasio hoy. Trabajo anti-extensión: le enseña al core a NO dejar arquear la lumbar. Especialmente útil con hiperlaxitud.</p>
      </div>
      {CORE_HOME.map((e,i)=><div key={i} style={{...S.cd,padding:"9px 14px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <span style={{fontSize:13.5,color:"#FFF",fontWeight:600}}>{i+1}. {e.n}</span>
          <span style={{fontSize:12,color:"#3E9A8C",fontWeight:700}}>{e.s} x {e.r}</span></div>
        <div style={{fontSize:11,color:"#999",marginTop:4,fontStyle:"italic"}}>{e.note}</div>
      </div>)}
      {dayName==="Sabado"&&<p style={{fontSize:11,color:"#888",marginTop:6}}>El sábado es opcional: hacelo solo si venís entero. Mañana tenés tenis.</p>}
    </div>}
    {sport&&<div style={{...S.cd,borderLeft:"3px solid #F39C12",background:"rgba(243,156,18,0.06)"}}>
      <p style={{fontSize:12,color:"#CCC",lineHeight:1.6,margin:0}}>{dayName==="Jueves"?"Día de fútbol: nada de pesas. Las piernas tienen que llegar frescas al partido. Comida con carbos y proteína 2-3 h antes.":"Día de tenis. Recuperación real: sin pesas."}</p>
    </div>}
    <div style={{...S.cd,marginTop:14,padding:"12px 14px"}}>
      <div style={{fontSize:11,color:"#888",letterSpacing:1.2,fontWeight:600,marginBottom:6}}>{"\u{1F3C3}"} CARDIO</div>
      <p style={{fontSize:12.5,color:"#CCC",margin:0,lineHeight:1.5}}>{DAY_CARDIO[dayName]}</p>
    </div>
  </div>;
}

function PlanTab({data,setData}){
  const pi=data.phase||0;
  const ph=PHASES[pi];
  const[selDay,setSelDay]=useState(null);
  const[editDays,setEditDays]=useState(false);
  const sug=faseSugerida(data);
  const semPlan=semanasDesde(data.planStart);
  const setInicio=v=>{const nd={...data,planStart:v};setData(nd);sv(nd)};
  const pasarAFase=i=>{const nd={...data,phase:i};setData(nd);sv(nd);setEditDays(false)};
  const sched=phSched(data,pi);
  if(selDay!==null){const day=sched.find(d=>d._i===selDay)||ph.schedule[selDay];return <div style={S.pg}>
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setSelDay(null)} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0}}>{day.day}: {day.name}</h2></div>
    <div style={{display:"flex",gap:4,marginBottom:16,flexWrap:"wrap"}}>{day.muscles.map(g=><span key={g} style={{fontSize:10,padding:"2px 8px",borderRadius:10,background:MG[g]?.c+"22",color:MG[g]?.c,fontWeight:600}}>{MG[g]?.l}</span>)}</div>
    {day.exercises.map((ex,i)=><div key={i} style={S.cd}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><h3 style={{fontSize:15,fontFamily:"'Oswald',sans-serif",color:"#FFF",margin:0}}>{ex.n}</h3><span style={{fontSize:13,color:"#FF6B35",fontWeight:700}}>{ex.s} x {ex.r}</span></div>
      {ex.w&&<div style={{fontSize:13,color:"#2ECC71",marginTop:6,fontWeight:600}}>Peso sugerido: {ex.w}</div>}
      <div style={{fontSize:12,color:"#888",marginTop:4}}>Descanso: {ex.rest}</div>
      {ex.note&&<p style={{fontSize:12,color:"#AAA",marginTop:4,fontStyle:"italic"}}>{ex.note}</p>}
    </div>)}
  </div>}
  const usedDays=sched.map(d=>d.day);
  const dupDays=[...new Set(usedDays.filter((d,i)=>usedDays.indexOf(d)!==i))];
  const customized=!!(data.dayOverrides||{})[pi];
  return <div style={S.pg}>
    <h2 style={S.t1}>{"\u{1F4CB}"} Plan de entrenamiento</h2>
    {!data.planStart&&<div style={{...S.cd,borderLeft:"3px solid #3498DB",background:"rgba(52,152,219,0.06)"}}>
      <div style={{fontSize:12.5,color:"#FFF",fontWeight:600,marginBottom:4}}>¿Cuándo arrancaste el plan?</div>
      <p style={{fontSize:11.5,color:"#999",marginTop:0,marginBottom:8,lineHeight:1.5}}>Con esa fecha la app sabe en qué semana estás y te avisa cuando te toca cambiar de fase. No cambia nada sola.</p>
      <input type="date" value={td()} onChange={e=>setInicio(e.target.value)} style={S.inp}/>
    </div>}
    {sug&&sug.fase!==pi&&<div style={{...S.cd,borderLeft:"3px solid #F39C12",background:"rgba(243,156,18,0.08)"}}>
      <div style={{fontSize:12,color:"#F39C12",fontWeight:700,marginBottom:4}}>{"\u26A0\uFE0F"} Semana {sug.semana} del plan</div>
      <p style={{fontSize:12,color:"#CCC",marginTop:0,marginBottom:10,lineHeight:1.5}}>Por calendario ya te toca <b style={{color:"#FFF"}}>{PHASES[sug.fase].name}</b>, pero seguís en {ph.name}. Cambiá cuando te sientas listo: si faltaste o venís cansado, quedate donde estás.</p>
      <button onClick={()=>{if(window.confirm("Pasar a "+PHASES[sug.fase].name+"?"))pasarAFase(sug.fase)}} style={{...S.btn,width:"100%",padding:"11px 16px",fontSize:13,background:"linear-gradient(135deg,#F39C12,#D68910)"}}>Pasar a {PHASES[sug.fase].name}</button>
    </div>}
    <div style={{...S.cd,borderLeft:"3px solid "+ph.c,background:"linear-gradient(135deg,"+ph.c+"15,"+ph.c+"05)"}}>
      <span style={{fontSize:32}}>{ph.ic}</span>
      <h3 style={{fontFamily:"'Oswald',sans-serif",fontSize:20,color:ph.c,margin:"4px 0"}}>{ph.name}</h3>
      <p style={{fontSize:13,color:"#AAA"}}>Semanas {ph.wk} - {ph.days} dias/semana</p>
      <p style={{fontSize:12,color:"#888",marginTop:4}}>{ph.desc}</p>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:16,marginBottom:4}}>
      <h3 style={{...S.t1,fontSize:14,margin:0}}>Sesiones de la semana</h3>
      <button onClick={()=>setEditDays(v=>!v)} style={{...S.sm,color:editDays?"#FF6B35":"#888"}}>{editDays?"Listo":"✏️ Dias"}</button>
    </div>
    {editDays?<div>
      <p style={{fontSize:11,color:"#888",marginBottom:10,lineHeight:1.5}}>Elegí qué día de la semana hacés cada sesión. Se guarda por fase.</p>
      {ph.schedule.map((sess,i)=>{
        const cur=((data.dayOverrides||{})[pi]||{})[i]||sess.day;
        return <div key={i} style={{...S.cd,padding:"10px 14px"}}>
          <div style={{fontSize:13,color:"#FFF",fontWeight:600,marginBottom:6}}>{sess.name}</div>
          <select value={cur} onChange={e=>setDayOv(data,setData,pi,i,e.target.value)} style={S.inp}>
            {WEEKDAYS.map(d=><option key={d} value={d} style={{background:"#1a1a1a"}}>{d}{SPORT_DAYS[d]?" — "+SPORT_DAYS[d]:""}</option>)}
          </select>
          {SPORT_DAYS[cur]&&<p style={{fontSize:11,color:"#F39C12",marginTop:6,marginBottom:0}}>{"⚠️"} Ese día tenés {SPORT_DAYS[cur]}. Ojo con las piernas.</p>}
        </div>;
      })}
      {dupDays.length>0&&<div style={{...S.cd,borderLeft:"3px solid #E74C3C",background:"rgba(231,76,60,0.06)",padding:"10px 14px"}}>
        <p style={{fontSize:12,color:"#E74C3C",margin:0}}>Tenés 2 sesiones el mismo día: {dupDays.join(", ")}</p>
      </div>}
      {customized&&<button onClick={()=>resetDayOv(data,setData,pi)} style={{...S.eo,justifyContent:"center",color:"#888"}}>Restaurar días por defecto</button>}
    </div>:sched.map(day=><button key={day._i} onClick={()=>setSelDay(day._i)} style={S.eo}>
      <div><span style={{fontWeight:700,color:"#FFF"}}>{day.day}</span>{SPORT_DAYS[day.day]&&<span style={{fontSize:11,color:"#F39C12",marginLeft:6}}>{SPORT_DAYS[day.day]}</span>}<br/><span style={{fontSize:12,color:"#AAA"}}>{day.name}</span></div>
      <span style={{fontSize:12,color:ph.c}}>{day.exercises.length} ej. &#8594;</span>
    </button>)}
    <h3 style={{...S.t1,fontSize:14,marginTop:16}}>{"\u{1F3C3}"} Cardio</h3>
    <div style={S.cd}><p style={{fontSize:13,color:"#CCC"}}>{ph.cardio}</p></div>
    <h3 style={{...S.t1,fontSize:14,marginTop:16}}>{"\u{1F3AF}"} Objetivos</h3>
    {ph.goals.map((g,i)=><div key={i} style={{...S.cd,padding:"10px 14px",display:"flex",gap:10,alignItems:"flex-start"}}><span style={{color:ph.c,fontSize:14}}>&#8226;</span><p style={{fontSize:13,color:"#CCC",margin:0}}>{g}</p></div>)}
    <div style={{...S.cd,marginTop:16,borderLeft:"3px solid "+ph.rpe.color,background:ph.rpe.color+"0A"}}>
      <h4 style={{fontSize:13,fontFamily:"'Oswald',sans-serif",color:ph.rpe.color,margin:"0 0 8px"}}>INTENSIDAD: {ph.rpe.title}</h4>
      <p style={{fontSize:12,color:"#CCC",lineHeight:1.6,margin:0}}>{ph.rpe.desc}</p>
    </div>
    <div style={{...S.cd,marginTop:10,borderLeft:"3px solid #9B59B6",background:"rgba(155,89,182,0.06)"}}>
      <h4 style={{fontSize:13,fontFamily:"'Oswald',sans-serif",color:"#9B59B6",margin:"0 0 8px"}}>HABLAR CON EL COACH IA</h4>
      <p style={{fontSize:12,color:"#CCC",lineHeight:1.6,margin:0}}>Al terminar cada sesion en la pestana <b style={{color:"#FFF"}}>"Entreno"</b>, escribi como te sentiste. El Coach IA te dice si subir/bajar peso, si cambiar series/reps, y si estas listo para avanzar de fase. Necesitas API key en Config.</p>
    </div>
    {data.planNotes?.length>0&&<div style={{marginTop:16}}><h3 style={{...S.t1,fontSize:14}}>{"\u{1F9E0}"} Notas del Coach sobre el plan</h3><div style={S.aicd}><p style={{fontSize:13,lineHeight:1.5,color:"#CCC",whiteSpace:"pre-wrap"}}>{data.planNotes.at(-1).note}</p><p style={{fontSize:11,color:"#888",marginTop:8}}>{fd(data.planNotes.at(-1).date)}</p></div></div>}
    <div style={{marginTop:20}}>
      <h3 style={{...S.t1,fontSize:14}}>Todas las fases</h3>
      {semPlan&&<p style={{fontSize:11,color:"#888",marginBottom:8}}>Vas por la semana {semPlan} desde que arrancaste.</p>}
      {PHASES.map((p,i)=><div key={i} onClick={()=>{if(i!==pi&&window.confirm("Cambiar a "+p.name+"?"))pasarAFase(i)}} style={{...S.cd,padding:"10px 14px",borderLeft:"3px solid "+(i===pi?p.c:"transparent"),background:i===pi?p.c+"14":"rgba(255,255,255,0.02)",opacity:i===pi?1:0.55,cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
          <span style={{fontSize:14,fontFamily:"'Oswald',sans-serif",color:i===pi?p.c:"#888"}}>{p.ic} {p.name}</span>
          <span style={{display:"flex",alignItems:"center",gap:8,whiteSpace:"nowrap"}}>
            {i===pi&&<span style={{fontSize:10,fontWeight:700,color:"#0A0A0B",background:p.c,borderRadius:6,padding:"2px 7px",letterSpacing:0.5}}>ACTUAL</span>}
            {sug&&sug.fase===i&&i!==pi&&<span style={{fontSize:10,fontWeight:700,color:"#F39C12"}}>TE TOCA</span>}
            <span style={{fontSize:11,color:"#888"}}>Sem {p.wk} · {p.days}d</span>
          </span>
        </div>
      </div>)}
      {data.planStart&&<div style={{marginTop:10,display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:11,color:"#777"}}>Inicio del plan</span>
        <input type="date" value={data.planStart} onChange={e=>setInicio(e.target.value)} style={{...S.inp,flex:1,fontSize:12,padding:"6px 10px"}}/>
      </div>}
    </div>
  </div>;
}

function BodyTab({data,setData,apiKey}){
  const[sub,setSub]=useState("anthro");
  // antropometria
  const[adding,setAdding]=useState(false);
  const[vals,setVals]=useState({});
  const[date,setDate]=useState(td());
  const[selM,setSelM]=useState(null);
  const[exLoad,setExLoad]=useState(false);
  const[exNote,setExNote]=useState("");
  const[extras,setExtras]=useState([]);
  const[derIds,setDerIds]=useState([]);
  const anthroRef=React.useRef(null);
  // estudios
  const[stView,setStView]=useState("list");
  const[stSel,setStSel]=useState(null);
  const[stFile,setStFile]=useState(null);
  const[stType,setStType]=useState("laboratorio");
  const[stDate,setStDate]=useState(td());
  const[stLoad,setStLoad]=useState(false);
  const[stResult,setStResult]=useState(null);
  const[stErr,setStErr]=useState("");
  const studyRef=React.useRef(null);

  // Recalcula los deducibles cada vez que cambia un campo. Si escribís sobre uno
  // calculado, pasa a ser tuyo y deja de recalcularse.
  const cambiarVal=(id,valor)=>{
    const der=derIds.filter(k=>k!==id);
    const base={...vals}; der.forEach(k=>delete base[k]);
    if(valor!=="")base[id]=valor; else delete base[id];
    const d=derivarAnthro(base);
    setVals(d.vals);
    setDerIds(Object.keys(d.vals).filter(k=>base[k]===undefined));
  };
  const doSave=()=>{const reg={id:gi(),date,...vals};if(extras.length)reg._extras=extras;const nd={...data,anthropometry:[...(data.anthropometry||[]),reg]};setData(nd);sv(nd);setAdding(false);setVals({});setExtras([]);setDerIds([]);setExNote("")};

  const onAnthroFile=async(e)=>{
    const file=e.target.files&&e.target.files[0];if(e.target)e.target.value="";if(!file)return;
    if(!apiKey){alert("Necesitás cargar tu API key en Config.");return;}
    setExLoad(true);setExNote("");
    try{
      const block=await fileToBlock(file);
      const fields=ANTHRO.map(f=>'"'+f.id+'": '+f.l+(f.u?" ("+f.u+")":"")).join(", ");
      const txt="Analizá este estudio de composición corporal (antropometría ISAK, InBody, DEXA, balanza) y extraé TODOS los valores numéricos. No omitas ninguno.\n\nMUY IMPORTANTE: si el informe trae una tabla de MEDICIONES INDIVIDUALES —pliegues cutáneos uno por uno, perímetros, diámetros óseos— extraé CADA FILA por separado. Esa tabla suele estar en una página distinta de la del resumen de composición: buscala. No te quedes solo con las sumatorias ni con la tabla de porcentajes.\n\nCampos conocidos (usá exactamente estos ids): "+fields+"\n\nDevolvé SOLO JSON válido, sin markdown:\n{\"date\":\"YYYY-MM-DD o null\",\"values\":{\"weight\":77.5,\"triceps_f\":12.4},\"extras\":[{\"label\":\"nombre tal como figura\",\"value\":\"valor\",\"unit\":\"unidad o vacío\"}]}\n\nReglas:\n- En \"values\" van los que correspondan a un id conocido, aunque el informe los llame distinto (masa adiposa = fat_mass, pliegue tricipital = triceps_f, sumatoria de 6 pliegues = sum6).\n- En \"extras\" va todo lo demás. NO incluyas las tablas de rangos de referencia (Excelente/Bueno/Alto con sus cortes): esas no son mediciones tuyas.\n- Si el mismo dato figura en kg y en %, incluí los dos.\n- Recorré el documento entero, todas las páginas.";

      const resp=await callAIVision([block,{type:"text",text:txt}],apiKey,6000);
      const parsed=pj(resp);
      const nv={};
      Object.entries(parsed.values||{}).forEach(([k,v])=>{if(ANTHRO.some(f=>f.id===k)&&v!=null&&v!=="")nv[k]=String(v)});
      const ex0=(Array.isArray(parsed.extras)?parsed.extras:[]).filter(x=>x&&x.label&&x.value!=null&&x.value!=="").map(x=>({label:String(x.label),value:String(x.value),unit:String(x.unit||"")}));
      if(!Object.keys(nv).length&&!ex0.length){setExNote("No se reconocieron valores. Probá una foto más nítida o cargá manual.");setExLoad(false);return;}
      // los que vinieron con otro nombre se reubican en su campo; después se calcula lo derivable
      const rp=repartirExtras(nv,ex0);
      const dv=derivarAnthro(rp.vals);
      const ex=rp.extras;
      setVals(dv.vals);setExtras(ex);setDerIds(Object.keys(dv.vals).filter(k=>rp.vals[k]===undefined));
      if(parsed.date&&typeof parsed.date==="string"&&parsed.date.length===10&&parsed.date[4]==="-")setDate(parsed.date);
      setExNote("Se cargaron "+Object.keys(dv.vals).length+" valores"+(rp.movidos?" ("+rp.movidos+" reconocidos por nombre equivalente)":"")+(dv.calc?", "+dv.calc+" calculados":"")+(ex.length?" y quedaron "+ex.length+" adicionales":"")+". Revisalos y guardá.");
      setAdding(true);
    }catch(err){alert("Error al analizar: "+err.message);}
    setExLoad(false);
  };

  const onStudyFile=(e)=>{const file=e.target.files&&e.target.files[0];if(e.target)e.target.value="";if(!file)return;setStFile(file);setStResult(null);setStErr("");setStDate(td());setStView("new")};

  const analyzeStudy=async()=>{
    if(!apiKey){alert("Necesitás cargar tu API key en Config.");return;}
    if(!stFile)return;
    setStLoad(true);setStErr("");
    try{
      const block=await fileToBlock(stFile);
      const tl=STUDY_TYPES.find(t=>t.id===stType)?.l||"estudio";
      const txt="Sos un asistente que ORDENA y RESUME estudios médicos para que la persona los registre en su app de salud. Este estudio es de tipo \""+tl+"\". Extraé la información TAL COMO figura en el estudio. NO diagnostiques ni recomiendes tratamientos. Devolvé SOLO JSON válido, sin markdown:\n{\"title\":\"título corto\",\"date\":\"YYYY-MM-DD o null\",\"values\":[{\"label\":\"parámetro\",\"value\":\"valor\",\"unit\":\"unidad o vacío\",\"ref\":\"rango de referencia o vacío\",\"flag\":\"alto|bajo|normal|\"}],\"findings\":\"para imágenes/informes: hallazgos y conclusión tal como aparecen, resumido\",\"summary\":\"2-4 frases en lenguaje claro de QUÉ dice el estudio, sin diagnosticar\"}\nREGLA PRINCIPAL: extraé TODOS los parámetros del informe, sin excepción. Un laboratorio completo puede tener 40 o 60 analitos: van todos. No resumas la lista, no agrupes, no omitas los que estén dentro del rango. Recorré el documento entero, incluidas las tablas al pie y las páginas siguientes.\nPara laboratorios completá \"values\" con cada analito (hemograma con su fórmula leucocitaria, lípidos, glucemia, hepatograma, función renal, ionograma, tiroideo, vitaminas, hormonas, orina, etc.). Para imágenes usá \"findings\", y si el informe trae mediciones numéricas ponelas igual en \"values\". En \"flag\" marcá \"alto\"/\"bajo\" solo si el estudio o el rango lo indican; si está en rango \"normal\"; si no hay rango, vacío.";
      const resp=await callAIVision([block,{type:"text",text:txt}],apiKey,8000);
      const parsed=pj(resp);
      setStResult(parsed);
      if(parsed.date&&typeof parsed.date==="string"&&parsed.date.length===10&&parsed.date[4]==="-")setStDate(parsed.date);
    }catch(err){setStErr("No se pudo analizar: "+err.message);}
    setStLoad(false);
  };

  const saveStudy=()=>{
    const study={id:gi(),type:stType,date:stDate,fileName:(stFile&&stFile.name)||"",title:(stResult&&stResult.title)||STUDY_TYPES.find(t=>t.id===stType)?.l,values:(stResult&&stResult.values)||[],findings:(stResult&&stResult.findings)||"",summary:(stResult&&stResult.summary)||""};
    const nd={...data,healthStudies:[...(data.healthStudies||[]),study]};
    setData(nd);sv(nd);
    setStView("list");setStFile(null);setStResult(null);setStErr("");setStType("laboratorio");setStDate(td());
  };
  const delStudy=(id)=>{const nd={...data,healthStudies:(data.healthStudies||[]).filter(s=>s.id!==id)};setData(nd);sv(nd);setStSel(null);setStView("list")};

  const flagC=(f)=>f==="alto"?"#E74C3C":f==="bajo"?"#F39C12":f==="normal"?"#2ECC71":"#888";
  const flagT=(f)=>f==="alto"?"↑ Alto":f==="bajo"?"↓ Bajo":f==="normal"?"✓":"";
  const disclaimer=<p style={{fontSize:11,color:"#888",lineHeight:1.5,marginTop:12,fontStyle:"italic"}}>{"⚠️"} Esto es un resumen de lo que dice el estudio, no un diagnóstico. Consultá los resultados con tu médico.</p>;

  // ── ANTROPOMETRIA: detalle de una metrica ──
  if(selM){const f=ANTHRO.find(x=>x.id===selM);const pts=(data.anthropometry||[]).filter(a=>a[selM]).sort((a,b)=>a.date.localeCompare(b.date));const vs=pts.map(p=>Number(p[selM]));const mx=vs.length?Math.max(...vs):0;const mn=vs.length?Math.min(...vs):0;const rng=mx-mn||1;
    return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setSelM(null)} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0}}>{f.l}</h2></div>
    {pts.length>1&&<div style={S.cd}><h4 style={{fontSize:13,color:"#888",margin:"0 0 12px",fontFamily:"'Oswald',sans-serif"}}>EVOLUCION</h4><div style={{display:"flex",alignItems:"flex-end",gap:4,height:120}}>{pts.map((p,i)=>{const v=Number(p[selM]);const h=((v-mn)/rng)*90+10;return <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:10,color:"#AAA"}}>{v}</span><div style={{width:"100%",height:h+"%",minHeight:4,background:"linear-gradient(180deg,#FF6B35,#D62828)",borderRadius:4}}/><span style={{fontSize:8,color:"#666"}}>{p.date.slice(5)}</span></div>})}</div></div>}
    {pts.map((p,i)=><div key={i} style={{...S.cd,padding:12,display:"flex",justifyContent:"space-between"}}><span style={{fontSize:13,color:"#888"}}>{fd(p.date)}</span><span style={{fontSize:14,color:"#FF6B35",fontWeight:700}}>{p[selM]} {f.u}</span></div>)}
    {pts.length===0&&<p style={{color:"#888",textAlign:"center",fontSize:14}}>Sin mediciones.</p>}
    </div>}

  // ── ANTROPOMETRIA: nueva medicion ──
  if(adding)return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>{setAdding(false);setExNote("")}} style={S.sm}>&#8592;</button><h2 style={S.t1}>Nueva medicion</h2></div>
    <input ref={anthroRef} type="file" accept="image/*,application/pdf" onChange={onAnthroFile} style={{display:"none"}}/>
    <button onClick={()=>anthroRef.current&&anthroRef.current.click()} disabled={exLoad} style={{...S.btn,width:"100%",marginBottom:12,background:exLoad?"#444":"linear-gradient(135deg,#3498DB,#2C7BB6)",opacity:exLoad?0.7:1}}>{exLoad?"Analizando estudio...":"\u{1F4CE} Adjuntar estudio y autocompletar"}</button>
    {exNote&&<div style={{...S.tbdg,marginTop:0,marginBottom:12,background:"rgba(52,152,219,0.1)",border:"1px solid rgba(52,152,219,0.3)",color:"#5DADE2"}}>{exNote}</div>}
    <label style={S.lbl}>Fecha</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} style={{...S.inp,marginBottom:16}}/>
    <p style={{fontSize:12,color:"#888",marginBottom:12}}>Completá solo lo que tengas. No hace falta todo.</p>
    {ANTHRO_G.map(g=><div key={g} style={{marginBottom:14}}>
      <div style={{fontSize:11,color:"#FF6B35",letterSpacing:1.2,fontWeight:700,marginBottom:6}}>{g.toUpperCase()}</div>
      {ANTHRO.filter(f=>f.g===g).map(f=><div key={f.id} style={{display:"flex",alignItems:"center",gap:8,marginBottom:7}}>
        <label style={{fontSize:12.5,color:vals[f.id]?"#FFF":"#999",flex:1}}>{f.l}{derIds.indexOf(f.id)>=0&&<span style={{fontSize:9.5,color:"#3E9A8C",marginLeft:6,fontWeight:700,letterSpacing:0.4}}>CALC</span>}</label>
        <input type="number" inputMode="decimal" value={vals[f.id]||""} onFocus={e=>e.target.select()} onChange={e=>cambiarVal(f.id,e.target.value)} style={{...S.inp,width:78,textAlign:"right",color:derIds.indexOf(f.id)>=0?"#3E9A8C":"#FFF",borderColor:derIds.indexOf(f.id)>=0?"rgba(62,154,140,0.4)":undefined}} step="any" placeholder="-"/>
        <span style={{fontSize:11,color:"#888",width:30}}>{f.u}</span>
      </div>)}
      {ANTHRO.filter(f=>f.g===g&&vals[f.id]&&clasificar(f.id,vals[f.id])).map(f=>{const cl=clasificar(f.id,vals[f.id]);
        return <div key={f.id+"-cl"} style={{display:"flex",justifyContent:"flex-end",alignItems:"center",gap:6,marginTop:-3,marginBottom:7}}>
          <span style={{fontSize:10,color:"#777"}}>{f.l}</span>
          <span style={{fontSize:10,fontWeight:700,color:"#0A0A0B",background:cl.c,borderRadius:5,padding:"2px 7px"}}>{cl.l}</span>
        </div>})}
    </div>)}
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
        <span style={{fontSize:11,color:"#3E9A8C",letterSpacing:1.2,fontWeight:700}}>OTROS VALORES DEL INFORME</span>
        <span style={{display:"flex",gap:6}}>
          {extras.length>0&&<button onClick={()=>{const rp=repartirExtras(vals,extras);const dv=derivarAnthro(rp.vals);setVals(dv.vals);setExtras(rp.extras);setDerIds(Object.keys(dv.vals).filter(k=>rp.vals[k]===undefined));setExNote(rp.movidos||dv.calc?"Se reubicaron "+rp.movidos+" y se calcularon "+dv.calc+".":"No se pudo reubicar ninguno.")}} style={{...S.sm,fontSize:11}}>Reubicar</button>}
          <button onClick={()=>setExtras([...extras,{label:"",value:"",unit:""}])} style={{...S.sm,fontSize:11}}>+ Agregar</button>
        </span>
      </div>
      {extras.length===0&&<p style={{fontSize:11,color:"#777",margin:0}}>Todo lo que el estudio traiga y no entre en las categorías de arriba aparece acá.</p>}
      {extras.filter(x=>isNaN(Number(String(x.value).replace(",",".")))).length>0&&<p style={{fontSize:10.5,color:"#777",margin:"0 0 8px",lineHeight:1.4}}>Las valoraciones en texto (Alto, Elevado, etc.) se guardan tal cual: no son números y no entran en ningún campo.</p>}
      {extras.map((x,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:6}}>
        <input value={x.label} placeholder="Parámetro" onChange={e=>{const n=[...extras];n[i]={...n[i],label:e.target.value};setExtras(n)}} style={{...S.inp,flex:1,fontSize:12}}/>
        <input value={x.value} placeholder="Valor" onChange={e=>{const n=[...extras];n[i]={...n[i],value:e.target.value};setExtras(n)}} style={{...S.inp,width:70,textAlign:"right",fontSize:12}}/>
        <input value={x.unit} placeholder="ud." onChange={e=>{const n=[...extras];n[i]={...n[i],unit:e.target.value};setExtras(n)}} style={{...S.inp,width:44,fontSize:12}}/>
        <button onClick={()=>setExtras(extras.filter((_,j)=>j!==i))} style={S.sm}>x</button>
      </div>)}
    </div>
    <button onClick={doSave} disabled={!Object.keys(vals).length&&!extras.length} style={{...S.btn,width:"100%",marginTop:16,opacity:(Object.keys(vals).length||extras.length)?1:0.5}}>Guardar</button>
  </div>;

  // ── ESTUDIOS: nuevo (analizar/revisar) ──
  if(stView==="new")return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>{setStView("list");setStFile(null);setStResult(null);setStErr("")}} style={S.sm}>&#8592;</button><h2 style={S.t1}>Nuevo estudio</h2></div>
    <div style={{...S.cd,display:"flex",alignItems:"center",gap:10}}><span style={{fontSize:22}}>{"\u{1F4C4}"}</span><span style={{fontSize:13,color:"#CCC",wordBreak:"break-all"}}>{(stFile&&stFile.name)||"Sin archivo"}</span></div>
    <label style={S.lbl}>Tipo de estudio</label>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:16}}>{STUDY_TYPES.map(t=><button key={t.id} onClick={()=>setStType(t.id)} style={{...S.mb2,flexDirection:"row",padding:"10px 8px",border:stType===t.id?"2px solid #FF6B35":"1px solid rgba(255,255,255,0.08)",background:stType===t.id?"rgba(255,107,53,0.15)":"rgba(255,255,255,0.03)"}}><span style={{fontSize:16}}>{t.i}</span><span style={{fontSize:11}}>{t.l}</span></button>)}</div>
    {!stResult&&<button onClick={analyzeStudy} disabled={stLoad} style={{...S.btn,width:"100%",background:stLoad?"#444":"linear-gradient(135deg,#FF6B35,#D62828)",opacity:stLoad?0.7:1}}>{stLoad?"Analizando con IA...":"\u{1F50D} Analizar con IA"}</button>}
    {stErr&&<p style={{color:"#E74C3C",fontSize:13,marginTop:12,textAlign:"center"}}>{stErr}</p>}
    {stResult&&<div style={{marginTop:8}}>
      <label style={S.lbl}>Fecha del estudio</label><input type="date" value={stDate} onChange={e=>setStDate(e.target.value)} style={{...S.inp,marginBottom:16}}/>
      {stResult.summary&&<div style={S.aicd}><h4 style={{fontSize:12,color:"#FF6B35",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>RESUMEN</h4><p style={{fontSize:13,lineHeight:1.5,color:"#DDD"}}>{stResult.summary}</p></div>}
      {stResult.values&&stResult.values.length>0&&<div style={{marginTop:12}}><h4 style={{fontSize:12,color:"#888",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>VALORES ({stResult.values.length})</h4>{stResult.values.map((v,i)=><div key={i} style={{...S.cd,padding:"10px 12px",marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:"#CCC"}}>{v.label}</span><span style={{fontSize:14,fontWeight:700,color:flagC(v.flag)}}>{v.value} {v.unit} {flagT(v.flag)&&<span style={{fontSize:11}}>{flagT(v.flag)}</span>}</span></div>{v.ref&&<span style={{fontSize:11,color:"#666"}}>Ref: {v.ref}</span>}</div>)}</div>}
      {stResult.findings&&<div style={{...S.cd,marginTop:12}}><h4 style={{fontSize:12,color:"#888",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>HALLAZGOS</h4><p style={{fontSize:13,lineHeight:1.5,color:"#CCC",whiteSpace:"pre-wrap"}}>{stResult.findings}</p></div>}
      {disclaimer}
      <button onClick={saveStudy} style={{...S.btn,width:"100%",marginTop:16}}>Guardar estudio</button>
      <button onClick={analyzeStudy} disabled={stLoad} style={{...S.aset,marginTop:8}}>Reanalizar</button>
    </div>}
  </div>;

  // ── ESTUDIOS: detalle ──
  if(stView==="detail"&&stSel){const s=(data.healthStudies||[]).find(x=>x.id===stSel);if(!s)return <div style={S.pg}><button onClick={()=>{setStView("list");setStSel(null)}} style={S.sm}>&#8592;</button><p style={{color:"#888",marginTop:16}}>Estudio no encontrado.</p></div>;const ti=STUDY_TYPES.find(t=>t.id===s.type);
    return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>{setStView("list");setStSel(null)}} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0,flex:1}}>{ti?.i} {s.title}</h2><button onClick={()=>delStudy(s.id)} style={S.sm}>x</button></div>
    <p style={{fontSize:12,color:"#888",marginBottom:16}}>{ti?.l} · {fd(s.date)}</p>
    {s.summary&&<div style={S.aicd}><h4 style={{fontSize:12,color:"#FF6B35",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>RESUMEN</h4><p style={{fontSize:13,lineHeight:1.5,color:"#DDD"}}>{s.summary}</p></div>}
    {s.values&&s.values.length>0&&<div style={{marginTop:12}}><h4 style={{fontSize:12,color:"#888",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>VALORES</h4>{s.values.map((v,i)=><div key={i} style={{...S.cd,padding:"10px 12px",marginBottom:6}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:13,color:"#CCC"}}>{v.label}</span><span style={{fontSize:14,fontWeight:700,color:flagC(v.flag)}}>{v.value} {v.unit} {flagT(v.flag)&&<span style={{fontSize:11}}>{flagT(v.flag)}</span>}</span></div>{v.ref&&<span style={{fontSize:11,color:"#666"}}>Ref: {v.ref}</span>}</div>)}</div>}
    {s.findings&&<div style={{...S.cd,marginTop:12}}><h4 style={{fontSize:12,color:"#888",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>HALLAZGOS</h4><p style={{fontSize:13,lineHeight:1.5,color:"#CCC",whiteSpace:"pre-wrap"}}>{s.findings}</p></div>}
    {disclaimer}
  </div>;}

  // ── VISTA PRINCIPAL ──
  const latest=(data.anthropometry||[]).length?(data.anthropometry||[]).sort((a,b)=>b.date.localeCompare(a.date))[0]:null;
  const studies=[...(data.healthStudies||[])].sort((a,b)=>b.date.localeCompare(a.date));
  const subNav=<div style={{display:"flex",gap:8,marginBottom:18}}>
    <button onClick={()=>setSub("anthro")} style={{...S.mb2,flexDirection:"row",flex:1,padding:"10px",border:sub==="anthro"?"2px solid #FF6B35":"1px solid rgba(255,255,255,0.08)",background:sub==="anthro"?"rgba(255,107,53,0.15)":"rgba(255,255,255,0.03)"}}><span>{"\u{1F4D0}"}</span><span style={{fontSize:12,fontWeight:600,color:sub==="anthro"?"#FFF":"#AAA"}}>Antropometría</span></button>
    <button onClick={()=>setSub("studies")} style={{...S.mb2,flexDirection:"row",flex:1,padding:"10px",border:sub==="studies"?"2px solid #FF6B35":"1px solid rgba(255,255,255,0.08)",background:sub==="studies"?"rgba(255,107,53,0.15)":"rgba(255,255,255,0.03)"}}><span>{"\u{1FA7A}"}</span><span style={{fontSize:12,fontWeight:600,color:sub==="studies"?"#FFF":"#AAA"}}>Estudios</span></button>
  </div>;

  return <div style={S.pg}><h2 style={S.t1}>{"\u{1F4AA}"} Cuerpo y Salud</h2>{subNav}
    {sub==="anthro"&&<div>
      <input ref={anthroRef} type="file" accept="image/*,application/pdf" onChange={onAnthroFile} style={{display:"none"}}/>
      <button onClick={()=>anthroRef.current&&anthroRef.current.click()} disabled={exLoad} style={{...S.btn,width:"100%",marginBottom:8,background:exLoad?"#444":"linear-gradient(135deg,#3498DB,#2C7BB6)",opacity:exLoad?0.7:1}}>{exLoad?"Analizando estudio...":"\u{1F4CE} Adjuntar estudio (autocompleta)"}</button>
      <button onClick={()=>{setVals({});setExtras([]);setDerIds([]);setExNote("");setDate(td());setAdding(true)}} style={{...S.aset,marginBottom:20,marginTop:0}}>+ Cargar manualmente</button>
      {latest&&<div style={{marginBottom:16}}>
        <h3 style={{...S.t1,fontSize:14}}>Última medición — {fd(latest.date)}</h3>
        {ANTHRO_G.filter(g=>ANTHRO.some(f=>f.g===g&&latest[f.id])).map(g=><div key={g} style={{marginBottom:14}}>
          <div style={{fontSize:11,color:"#FF6B35",letterSpacing:1.2,fontWeight:700,marginBottom:6}}>{g.toUpperCase()}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {ANTHRO.filter(f=>f.g===g&&latest[f.id]).map(f=>{const cl=clasificar(f.id,latest[f.id]);

    if(apiKey){try{const txt=await callAI(buildPrompt(toSave,ns,fb,data.meals),apiKey);setAiRes(txt);nd.coachNotes=[...nd.coachNotes,{sessionId:toSave.id,date:toSave.date,note:txt,feedback:fb}];nd.planNotes=[...(nd.planNotes||[]),{date:toSave.date,note:txt}]}catch(e){setAiRes("Error: "+e.message)}}

  if(!ses){const last=data.sessions.at(-1);return <div style={S.pg}><div style={S.hero}><span style={{fontSize:48}}>{"\u{1F525}"}</span><h2 style={{fontFamily:"'Oswald',sans-serif",fontSize:22,margin:"8px 0 4px"}}>Listo para forjar?</h2><p style={{fontSize:13,color:"#AAA",margin:0}}>{last?"Ultima: "+fd(last.date):"Comenza a registrar"}</p><button onClick={()=>start()} style={{...S.btn,marginTop:16,width:"100%"}}>Iniciar sesión</button>

function CardioTab({data,setData}){
  const[adding,setAdding]=useState(false);const[type,setType]=useState("running");const[p,setP]=useState("");const[s2,setS2]=useState("");const[date,setDate]=useState(td());const[notes,setNotes]=useState("");

  const sorted=[...data.cardioSessions].sort((a,b)=>b.date.localeCompare(a.date));
  return <div style={S.pg}><h2 style={S.t1}>{"\u{1F3C3}"} Cardio</h2><button onClick={()=>setAdding(true)} style={{...S.btn,width:"100%",marginBottom:20}}>+ Registrar cardio</button>{sorted.length===0?<p style={{color:"#888",textAlign:"center",fontSize:14}}>Sin sesiones.</p>:sorted.map(c=>{const ct=CT[c.type];return <div key={c.id} style={S.cd}><div style={{display:"flex",justifyContent:"space-between"}}><div><span style={{fontSize:20,marginRight:8}}>{ct?.i}</span><span style={{fontFamily:"'Oswald',sans-serif",fontSize:16,color:"#FFF"}}>{ct?.l}</span><p style={{fontSize:12,color:"#888",margin:"4px 0 0"}}>{fd(c.date)}</p></div><button onClick={()=>del(c.id)} style={S.sm}>x</button></div><div style={{display:"flex",gap:16,marginTop:8}}><span style={{fontSize:14,color:"#FF6B35",fontWeight:700}}>{c.primary} {ct?.u}</span><span style={{fontSize:14,color:"#AAA"}}>{c.secondary} {ct?.su}</span></div>{c.notes&&<p style={{fontSize:12,color:"#999",marginTop:6,fontStyle:"italic"}}>{c.notes}</p>}</div>})}</div>;
}

function ProgressTab({data}){
  const[sg,setSg]=useState(null);const[se,setSe]=useState(null);
  const gs={};Object.keys(MG).forEach(g=>{gs[g]={sc:new Set(data.sessions.filter(s=>s.exercises.some(e=>e.muscleGroup===g)).map(s=>s.id)).size}});
  if(se&&sg){const hist=data.sessions.flatMap(s=>s.exercises.filter(e=>e.name===se).map(e=>({...e,date:s.date}))).sort((a,b)=>a.date.localeCompare(b.date));const cd2=hist.map(h=>({date:h.date,mw:Math.max(...h.sets.map(s=>s.weight))}));const pk=cd2.length?Math.max(...cd2.map(h=>h.mw)):0;
    return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setSe(null)} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0}}>{se}</h2></div><div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:16}}><div style={S.stc}><span style={S.stv}>{pk}<span style={S.stu}>kg</span></span><span style={S.stl}>Peso max</span></div><div style={S.stc}><span style={S.stv}>{hist.length}</span><span style={S.stl}>Sesiones</span></div></div>{cd2.length>1&&<div style={S.cd}><h4 style={{fontSize:13,color:"#888",margin:"0 0 12px",fontFamily:"'Oswald',sans-serif"}}>PROGRESION</h4><div style={{display:"flex",alignItems:"flex-end",gap:4,height:120}}>{cd2.map((h,i)=><div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}><span style={{fontSize:10,color:"#AAA"}}>{h.mw}</span><div style={{width:"100%",height:(pk>0?(h.mw/pk)*100:10)+"%",minHeight:4,background:"linear-gradient(180deg,#FF6B35,#D62828)",borderRadius:4}}/><span style={{fontSize:8,color:"#666"}}>{h.date.slice(5)}</span></div>)}</div></div>}{hist.map((h,i)=><div key={i} style={{...S.cd,padding:12}}><div style={{fontSize:12,color:"#888",marginBottom:6}}>{fd(h.date)}</div>{h.sets.map((s2,j)=><div key={j} style={{fontSize:13,color:"#CCC",display:"flex",gap:8}}><span style={{color:"#888",width:28}}>S{j+1}</span><span style={{color:"#FF6B35",fontWeight:700,width:50}}>{s2.weight}kg</span><span>x {s2.repsR===undefined?s2.reps:(s2.reps+" izq / "+s2.repsR+" der")}</span></div>)}</div>)}</div>}
  if(sg){const names=[...new Set(data.sessions.flatMap(s=>s.exercises.filter(e=>e.muscleGroup===sg).map(e=>e.name)))];return <div style={S.pg}><div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}><button onClick={()=>setSg(null)} style={S.sm}>&#8592;</button><h2 style={{...S.t1,margin:0,color:MG[sg].c}}>{MG[sg].i} {MG[sg].l}</h2></div>{names.length===0?<p style={{color:"#888",textAlign:"center"}}>Sin ejercicios.</p>:names.map(n=>{const h=data.sessions.flatMap(s=>s.exercises.filter(e=>e.name===n));const mw=Math.max(...h.flatMap(x=>x.sets.map(s=>s.weight)),0);return <button key={n} onClick={()=>setSe(n)} style={S.eo}><span>{n}</span><span style={{color:"#FF6B35",fontSize:13,fontWeight:700}}>{mw}kg - {h.length}</span></button>})}</div>}
  const ts=data.sessions.length,tv=data.sessions.reduce((sum,s)=>sum+s.exercises.reduce((s2,ex)=>s2+ex.sets.reduce((s3,st)=>s3+(Number(st.weight)||0)*setReps(st),0),0),0);

}

// ─── SETTINGS ───
function SettingsTab({apiKey,onApiKeyChange,data,setData}){
  const[k,setK]=useState(apiKey);const[saved,setSaved]=useState(false);
  const doSave=()=>{onApiKeyChange(k);setSaved(true);setTimeout(()=>setSaved(false),2000)};
  const[impMsg,setImpMsg]=useState(null);
  const[gd,setGd]=useState(GD.cfg());
  const[gdMsg,setGdMsg]=useState(null);
  const[gdBusy,setGdBusy]=useState(false);
  const gdRun=async(fn,okTxt)=>{
    setGdBusy(true);setGdMsg(null);
    try{await fn();setGd(GD.cfg());setGdMsg({ok:true,t:okTxt})}
    catch(e){if(e.message!=="__ELEGIR__")setGdMsg({ok:false,t:e.message||"Falló la sincronización"})}
    setGdBusy(false);
  };
  const[gdElegir,setGdElegir]=useState(null);   // {remoto, resumenRemoto, resumenLocal}
  const resumir=d=>{const st=bkStats(d);const partes=Object.keys(st).filter(k=>st[k]>0).map(k=>st[k]+" "+k.toLowerCase());return partes.length?partes.join(", "):"nada guardado"};
  const gdConnect=()=>gdRun(async()=>{
    await GD.getToken();
    const remoto=await GD.peek();
    if(remoto&&bkStats(remoto).Sesiones+bkStats(remoto).Comidas+bkStats(remoto)["Antropometrías"]>0){
      // Ya hay algo en Drive: que decida el usuario, no piso nada
      setGdElegir({remoto,rRemoto:resumir(remoto),rLocal:resumir(data)});
      throw new Error("__ELEGIR__");
    }
    await GD.push(data);
  },"Conectado. Tus datos ya están en Drive.");
  const gdUsarDrive=()=>gdRun(async()=>{
    const nd=gdElegir.remoto;
    sv(nd);setData(nd);GD.setCfg({auto:true,last:new Date().toISOString()});
    setGdElegir(null);setTimeout(()=>window.location.reload(),900);
  },"Listo. Trayendo los datos de Drive...");
  const gdUsarLocal=()=>gdRun(async()=>{await GD.push(data);setGdElegir(null)},"Listo. Se subieron los datos de este dispositivo.");
  const gdPush=()=>gdRun(()=>GD.push(data),"Subido a Drive.");
  const gdPull=()=>gdRun(async()=>{
    const nd=await GD.pull();
    const st=bkStats(nd);
    const resumen=Object.keys(st).map(k=>st[k]+" "+k.toLowerCase()).join(", ");
    if(!window.confirm("En Drive hay: "+resumen+".\n\nEsto REEMPLAZA los datos de este dispositivo. ¿Seguir?"))throw new Error("Cancelado");
    sv(nd);setData(nd);setTimeout(()=>window.location.reload(),900);
  },"Datos traídos de Drive. Recargando...");
  const gdOff=()=>{if(window.confirm("Se corta la sincronización en este dispositivo. El archivo de Drive queda como está. ¿Seguir?")){GD.clear();setGd({});setGdMsg(null)}};
  const stats=bkStats(data);
  const doImport=ev=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      try{
        const nd=bkParse(String(rd.result));
        const st=bkStats(nd);
        const resumen=Object.keys(st).map(k=>st[k]+" "+k.toLowerCase()).join(", ");
        if(window.confirm("El backup contiene: "+resumen+".\n\nEsto REEMPLAZA todos los datos actuales de este dispositivo. ¿Seguir?")){
          sv(nd);setData(nd);setImpMsg({ok:true,t:"Datos restaurados. Recargando..."});
          setTimeout(()=>window.location.reload(),1200);
        }
      }catch(e){setImpMsg({ok:false,t:"No se pudo leer: "+e.message})}
    };
    rd.onerror=()=>setImpMsg({ok:false,t:"No se pudo leer el archivo"});
    rd.readAsText(f);ev.target.value="";
  };
  return <div style={S.pg}><h2 style={S.t1}>{"⚙️"} Config</h2><div style={S.cd}><h3 style={{fontSize:14,color:"#FF6B35",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>API Key de Anthropic</h3><p style={{fontSize:12,color:"#888",marginBottom:12,lineHeight:1.5}}>Para el Coach IA. Solo se guarda en tu dispositivo. <a href="https://console.anthropic.com" target="_blank" rel="noopener" style={{color:"#FF6B35"}}>console.anthropic.com</a></p><input type="password" value={k} onChange={e=>setK(e.target.value)} placeholder="sk-ant-api..." style={{...S.inp,marginBottom:12}}/><button onClick={doSave} style={{...S.btn,width:"100%"}}>{saved?"Guardada!":"Guardar"}</button></div>
  <div style={{...S.cd,marginTop:16}}>
    <h3 style={{fontSize:14,color:"#4285F4",margin:"0 0 4px",fontFamily:"'Oswald',sans-serif"}}>Sincronización con Google Drive</h3>
    <p style={{fontSize:11,color:"#888",marginBottom:12,lineHeight:1.5}}>Guarda un archivo <b>forja-data.json</b> en tu Drive y lo mantiene al día. Así ves los mismos datos en el teléfono y en la computadora. FORJA solo puede tocar ese archivo: el resto de tu Drive le queda invisible.</p>
    {gd.auto
      ? <div>
          <div style={{display:"flex",alignItems:"center",gap:8,background:"rgba(66,133,244,0.08)",borderRadius:10,padding:"10px 14px",marginBottom:12}}>
            <span style={{width:8,height:8,borderRadius:4,background:"#2ECC71",flexShrink:0}}></span>
            <div style={{minWidth:0}}>
              <div style={{fontSize:12.5,color:"#FFF",fontWeight:600}}>Sincronización activa</div>
              <div style={{fontSize:10.5,color:"#888",marginTop:2}}>{gd.last?"Última vez: "+new Date(gd.last).toLocaleString("es-AR",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"Sin sincronizar todavía"}</div>
            </div>
          </div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={gdPush} disabled={gdBusy} style={{...S.aset,flex:1,marginTop:0,borderStyle:"solid",opacity:gdBusy?0.5:1}}>{"↑ Subir ahora"}</button>
            <button onClick={gdPull} disabled={gdBusy} style={{...S.aset,flex:1,marginTop:0,borderStyle:"solid",opacity:gdBusy?0.5:1}}>{"↓ Traer de Drive"}</button>
          </div>
          <button onClick={gdOff} style={{...S.aset,marginTop:8,color:"#777"}}>Desconectar este dispositivo</button>
        </div>
      : gdElegir
      ? <div style={{border:"1px solid rgba(66,133,244,0.4)",borderRadius:12,padding:"14px",background:"rgba(66,133,244,0.06)"}}>
          <div style={{fontSize:13,color:"#FFF",fontWeight:700,marginBottom:4}}>Ya hay datos en Drive</div>
          <p style={{fontSize:11.5,color:"#AAA",lineHeight:1.5,marginTop:0,marginBottom:12}}>Elegí con cuál te quedás. Lo otro se pierde.</p>
          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"10px 12px",marginBottom:8}}>
            <div style={{fontSize:11,color:"#4285F4",fontWeight:700,letterSpacing:0.5}}>EN DRIVE</div>
            <div style={{fontSize:12,color:"#CCC",marginTop:3,lineHeight:1.4}}>{gdElegir.rRemoto}</div>
          </div>
          <div style={{background:"rgba(255,255,255,0.04)",borderRadius:8,padding:"10px 12px",marginBottom:12}}>
            <div style={{fontSize:11,color:"#FF6B35",fontWeight:700,letterSpacing:0.5}}>EN ESTE DISPOSITIVO</div>
            <div style={{fontSize:12,color:"#CCC",marginTop:3,lineHeight:1.4}}>{gdElegir.rLocal}</div>
          </div>
          <button onClick={gdUsarDrive} disabled={gdBusy} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#4285F4,#2B62C7)",fontSize:13,padding:"12px 16px",opacity:gdBusy?0.6:1}}>{"↓ Traer lo de Drive"}</button>
          <button onClick={gdUsarLocal} disabled={gdBusy} style={{...S.aset,marginTop:8,borderStyle:"solid",opacity:gdBusy?0.6:1}}>{"↑ Subir lo de este dispositivo (pisa Drive)"}</button>
          <button onClick={()=>{setGdElegir(null);setGdMsg(null)}} style={{...S.aset,marginTop:6,color:"#777"}}>Cancelar</button>
        </div>
      : <button onClick={gdConnect} disabled={gdBusy} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#4285F4,#2B62C7)",opacity:gdBusy?0.6:1}}>{gdBusy?"Conectando...":"Conectar con Google Drive"}</button>}
    {gdMsg&&<p style={{fontSize:11.5,color:gdMsg.ok?"#2ECC71":"#E74C3C",marginTop:10,marginBottom:0,lineHeight:1.5}}>{gdMsg.t}</p>}
    <p style={{fontSize:10.5,color:"#777",marginTop:10,marginBottom:0,lineHeight:1.5}}>Con la sync activa, cada cambio se sube solo unos segundos después. Si editás en dos dispositivos sin sincronizar en el medio, gana el último que guarda.</p>
  </div>
  <div style={{...S.cd,marginTop:16}}>
    <h3 style={{fontSize:14,color:"#3498DB",margin:"0 0 4px",fontFamily:"'Oswald',sans-serif"}}>Copia de seguridad</h3>
    <p style={{fontSize:11,color:"#888",marginBottom:12,lineHeight:1.5}}>Tus datos viven solo en este dispositivo: no se sincronizan con la computadora ni con otro navegador. Exportá cada tanto y guardá el archivo donde quieras.</p>
    <div style={{background:"rgba(255,255,255,0.03)",borderRadius:10,padding:"12px 14px",marginBottom:12}}>
      <div style={{fontSize:11,color:"#888",letterSpacing:1,fontWeight:600,marginBottom:8}}>LO QUE HAY GUARDADO</div>
      {Object.keys(stats).map(k=><div key={k} style={{display:"flex",justifyContent:"space-between",padding:"2px 0"}}>
        <span style={{fontSize:12,color:"#CCC"}}>{k}</span>
        <span style={{fontSize:12,color:stats[k]>0?"#FFF":"#555",fontWeight:600}}>{stats[k]}</span></div>)}
      <div style={{display:"flex",justifyContent:"space-between",marginTop:8,paddingTop:8,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
        <span style={{fontSize:11,color:"#666"}}>Tamaño</span>
        <span style={{fontSize:11,color:"#666"}}>{bkSize()} KB de ~5.000 disponibles</span></div>
    </div>
    <button onClick={()=>bkExport(data)} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#3498DB,#2471A3)"}}>{"↓"} Exportar backup</button>
    <label style={{...S.aset,marginTop:10,display:"block",textAlign:"center",lineHeight:"20px"}}>
      {"↑ Importar backup"}
      <input type="file" accept="application/json,.json" onChange={doImport} style={{display:"none"}}/>
    </label>
    {impMsg&&<p style={{fontSize:11.5,color:impMsg.ok?"#2ECC71":"#E74C3C",marginTop:10,marginBottom:0}}>{impMsg.t}</p>}
    <p style={{fontSize:10.5,color:"#777",marginTop:10,marginBottom:0,lineHeight:1.5}}>Importar <b>reemplaza</b> todo lo que tengas en este dispositivo. Si tenés algo que no querés perder, exportá primero.</p>
  </div>
  <div style={{...S.cd,marginTop:16}}><h3 style={{fontSize:14,color:"#E74C3C",margin:"0 0 8px",fontFamily:"'Oswald',sans-serif"}}>Borrar datos</h3><button onClick={()=>{if(window.confirm("Seguro? Se borran TODOS los datos.")){localStorage.removeItem(SK);window.location.reload()}}} style={{...S.btn,width:"100%",background:"linear-gradient(135deg,#E74C3C,#C0392B)"}}>Borrar todo</button></div></div>;
}

    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
      <button onClick={()=>setView("home")} style={S.sm}>&#8592;</button>
      <h2 style={S.t1}>Historial</h2>
    </div>
    <label style={S.lbl}>Fecha</label>
    <input type="date" value={histDate} onChange={e=>setHistDate(e.target.value)} style={{...S.inp,marginBottom:16}}/>
    <MealList meals={histMeals}/>
  </div>;

  // ── WEEKLY PLAN VIEW ──
  if(view==="plan"){
    const plan=data.weeklyNutrPlan;
    if(!plan)return <div style={S.pg}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
        <button onClick={()=>setView("home")} style={S.sm}>&#8592;</button>
        <h2 style={S.t1}>Plan semanal</h2>
      </div>
      <div style={S.cd}><p style={{fontSize:13,color:"#888",textAlign:"center",lineHeight:1.6}}>Generá tu plan semanal personalizado con el Coach IA. Va a usar tus comidas típicas y tu fase de entrenamiento actual.</p></div>
      <button onClick={genPlan} disabled={aiLoad} style={{...S.btn,width:"100%",marginTop:12,opacity:aiLoad?0.6:1}}>{aiLoad?"⏳ Generando plan...":"✨ Generar plan con IA"}</button>
    </div>;
    const DAYS_ES=["Lunes","Martes","Miercoles","Jueves","Viernes","Sabado","Domingo"];
    return <div style={S.pg}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
        <button onClick={()=>setView("home")} style={S.sm}>&#8592;</button>
        <h2 style={S.t1}>Plan semanal</h2>
      </div>
      <p style={{fontSize:11,color:"#666",marginBottom:14}}>Generado el {fd(plan.generatedAt||td())}</p>
      {plan.proteinTarget&&<div style={{...S.cd,borderLeft:"3px solid #2ECC71",background:"rgba(46,204,113,0.06)",marginBottom:14}}>
        <span style={{fontSize:13,color:"#2ECC71",fontWeight:700}}>💪 Objetivo proteico: {plan.proteinTarget}</span>
      </div>}
      {plan.sundayCookingSession&&<div style={{...S.cd,borderLeft:"3px solid #FF6B35",marginBottom:14}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:11,color:"#FF6B35",fontFamily:"'Oswald',sans-serif",letterSpacing:1}}>🥘 SESIÓN DE COCINA — DOMINGO</div>
          {plan.sundayCookingSession.estimatedTime&&<div style={{fontSize:11,color:"#888"}}>⏱ {plan.sundayCookingSession.estimatedTime}</div>}
        </div>
        <p style={{fontSize:12,color:"#AAA",marginBottom:10}}>Preparar estos componentes por separado. Durante la semana los combinás distinto cada día.</p>
        {(plan.sundayCookingSession.components||[]).map((comp,i)=>{
          const eKey="sunday_"+i;const open=expandedMeals[eKey];
          return <div key={i} style={{marginBottom:6}}>
            <button onClick={()=>setExpandedMeals(p=>({...p,[eKey]:!p[eKey]}))} style={{width:"100%",background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"8px 10px",background:"rgba(255,255,255,0.04)",borderRadius:8,border:"1px solid rgba(255,255,255,0.06)"}}>
                <div>
                  <span style={{fontSize:13,color:"#FFF",fontWeight:600}}>{comp.name}</span>
                  <span style={{fontSize:12,color:"#FF6B35",marginLeft:8}}>{comp.quantity}</span>
                  {comp.protein&&<span style={{fontSize:11,color:"#2ECC71",marginLeft:8}}>{comp.protein}</span>}
                </div>
                <span style={{fontSize:10,color:"#555"}}>{open?"▲":"▼"}</span>
              </div>
            </button>
            {open&&comp.prep&&<div style={{fontSize:12,color:"#CCC",padding:"8px 10px",background:"rgba(255,255,255,0.02)",borderRadius:"0 0 8px 8px",borderLeft:"2px solid rgba(255,107,53,0.3)",marginTop:-2,lineHeight:1.5}}>{comp.prep}</div>}
          </div>;
        })}
      </div>}
      {plan.proteinTips?.length>0&&<div style={{...S.cd,borderLeft:"3px solid #2ECC71",background:"rgba(46,204,113,0.05)",marginBottom:14}}>
        <div style={{fontSize:11,color:"#2ECC71",fontFamily:"'Oswald',sans-serif",letterSpacing:1,marginBottom:8}}>💪 TIPS DE PROTEÍNA</div>
        {plan.proteinTips.map((tip,i)=><div key={i} style={{fontSize:12,color:"#CCC",padding:"4px 0",display:"flex",gap:8,alignItems:"flex-start"}}><span style={{color:"#2ECC71"}}>→</span><span>{tip}</span></div>)}
      </div>}
      {(plan.days||[]).map((day,i)=><div key={i} style={{...S.cd,marginBottom:10,borderLeft:"3px solid "+(day.isTraining?"#FF6B35":"#444")}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <span style={{fontFamily:"'Oswald',sans-serif",fontSize:15,color:day.isTraining?"#FF6B35":"#AAA"}}>{day.day}</span>
          <div style={{textAlign:"right"}}>
            {day.isTraining&&<div style={{fontSize:10,color:"#FF6B35"}}>{day.trainingName}</div>}
            {day.proteinEstimate&&<div style={{fontSize:12,color:"#2ECC71",fontWeight:700}}>{day.proteinEstimate} prot</div>}
          </div>
        </div>
        {day.meals&&Object.entries(day.meals).map(([mtype,opts])=>{
          const mt=MEAL_TYPES.find(t=>t.id===mtype);if(!mt||!opts)return null;
          return <div key={mtype} style={{marginBottom:8}}>
            <div style={{fontSize:10,color:"#666",fontFamily:"'Oswald',sans-serif",letterSpacing:0.5,textTransform:"uppercase",marginBottom:3}}>{mt.i} {mt.l}</div>
            {[{txt:opts.option1,qty:opts.option1q,num:"①"},{txt:opts.option2,qty:opts.option2q,num:"②"}].filter(o=>o.txt).map((o,oi)=>{
              const eKey=`${i}_${mtype}_${oi}`;
              const open=expandedMeals[eKey];
              return <div key={oi} style={{marginBottom:4}}>
                <button onClick={()=>setExpandedMeals(p=>({...p,[eKey]:!p[eKey]}))} style={{width:"100%",background:"none",border:"none",cursor:"pointer",textAlign:"left",padding:0}}>
                  <div style={{display:"flex",alignItems:"flex-start",gap:6,paddingLeft:8,borderLeft:"2px solid "+(oi===0?"rgba(255,107,53,0.35)":"rgba(255,255,255,0.1)")}}>
                    <span style={{fontSize:12,color:oi===0?"#DDD":"#999",flex:1,lineHeight:1.4}}>{o.num} {o.txt}</span>
                    {o.qty?.length>0&&<span style={{fontSize:10,color:"#555",marginTop:1,flexShrink:0}}>{open?"▲":"▼"}</span>}
                  </div>
                </button>
                {open&&o.qty?.length>0&&<div style={{marginLeft:8,marginTop:4,paddingLeft:8,borderLeft:"2px solid rgba(255,255,255,0.06)"}}>
                  {o.qty.map((q,qi)=><div key={qi} style={{fontSize:11,color:"#888",padding:"2px 0",display:"flex",alignItems:"center",gap:6}}>
                    <span style={{color:"#FF6B35",fontSize:9}}>●</span>{q}
                  </div>)}
                </div>}
              </div>;
            })}
          </div>;
        })}
      </div>)}
      <button onClick={genPlan} disabled={aiLoad} style={{...S.btn,width:"100%",marginTop:4,background:"rgba(255,255,255,0.06)",color:"#AAA",fontSize:13}}>{aiLoad?"⏳ Regenerando...":"🔄 Regenerar plan"}</button>
    </div>;
  }

  // ── SHOPPING LIST VIEW ──
  if(view==="shopping"){
    const plan=data.weeklyNutrPlan;
    if(!plan?.shoppingList)return <div style={S.pg}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:16}}>
        <button onClick={()=>setView("home")} style={S.sm}>&#8592;</button>
        <h2 style={S.t1}>Lista de compras</h2>
      </div>
      <div style={S.cd}><p style={{fontSize:13,color:"#888",textAlign:"center"}}>Primero generá el plan semanal y la lista de compras se arma automáticamente.</p></div>
      <button onClick={()=>setView("plan")} style={{...S.btn,width:"100%",marginTop:12}}>Ir al Plan semanal</button>
    </div>;
    const allItems=Object.entries(plan.shoppingList).flatMap(([cat,items])=>items.map(item=>({cat,item,key:cat+"_"+item})));
    const done=allItems.filter(i=>checkedItems[i.key]).length;
    return <div style={S.pg}>
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
        <button onClick={()=>setView("home")} style={S.sm}>&#8592;</button>
        <h2 style={S.t1}>🛒 Lista de compras</h2>
      </div>
      <p style={{fontSize:12,color:"#666",marginBottom:14}}>{done}/{allItems.length} items — semana del {fd(plan.generatedAt||td())}</p>
      {Object.entries(plan.shoppingList).map(([cat,items])=>(
        <div key={cat} style={{marginBottom:16}}>
          <div style={{fontSize:11,color:"#FF6B35",fontFamily:"'Oswald',sans-serif",letterSpacing:1,textTransform:"uppercase",marginBottom:8}}>{cat}</div>
          {items.map((item,i)=>{
            const key=cat+"_"+item;const done=checkedItems[key];
            return <button key={i} onClick={()=>setCheckedItems(prev=>({...prev,[key]:!prev[key]}))} style={{...S.eo,marginBottom:5,opacity:done?0.4:1,textDecoration:done?"line-through":"none"}}>
              <span style={{fontSize:14}}>{item}</span>
              <span style={{fontSize:18}}>{done?"✅":"⬜"}</span>
            </button>;
          })}
        </div>
      ))}
      <button onClick={()=>setCheckedItems({})} style={{...S.sm,width:"100%",marginTop:8,padding:"10px",color:"#888"}}>Limpiar marcados</button>
    </div>;
  }

  // ── HOME VIEW ──
  const todayMealsAll=todayMeals;
  const todayP=sumP(todayMeals),todayK=sumK(todayMeals);
  const todayC=Math.round(todayMeals.filter(m=>m.carbs).reduce((s,m)=>s+m.carbs,0));
  const todayF=Math.round(todayMeals.filter(m=>m.fat).reduce((s,m)=>s+m.fat,0));
  const plan=data.weeklyNutrPlan;
  const weightKgHome=data.anthropometry?.length?(data.anthropometry.sort((a,b)=>b.date.localeCompare(a.date))[0].weight||77.7):77.7;
  // Objetivo segun el calendario de entrenamiento, no segun lo que ya registraste
  const hoyDia=WEEKDAYS[(new Date().getDay()+6)%7];
  const tg=nutrTargets(data,hoyDia,weightKgHome);
  const targP=tg.p,targF=tg.f,targC=tg.c,totalKcal=tg.kcal;
  const LD=LOAD_LBL[tg.load];
  const sesHoy=phSched(data,data.phase||0).find(d=>d.day===hoyDia);
  const queToca=sesHoy?sesHoy.name:(SPORT_DAYS[hoyDia]?SPORT_DAYS[hoyDia].split(" ").slice(1).join(" "):"Sin pesas");
  const hasMacros=todayP>0||todayC>0||todayF>0;
  return <div style={S.pg}>
    <h2 style={S.t1}>🥗 Alimentación</h2>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:16}}>
      <button onClick={()=>setView("plan")} style={{...S.cd,cursor:"pointer",marginBottom:0,textAlign:"center",borderColor:plan?"rgba(255,107,53,0.3)":"rgba(255,255,255,0.06)"}}>
        <div style={{fontSize:20,marginBottom:4}}>📅</div>
        <div style={{fontSize:13,color:"#FFF",fontWeight:600}}>Plan semanal</div>
        <div style={{fontSize:10,color:plan?"#FF6B35":"#666"}}>{plan?"Ver plan":"Generar con IA"}</div>
      </button>
      <button onClick={()=>setView("shopping")} style={{...S.cd,cursor:"pointer",marginBottom:0,textAlign:"center",borderColor:plan?.shoppingList?"rgba(46,204,113,0.3)":"rgba(255,255,255,0.06)"}}>
        <div style={{fontSize:20,marginBottom:4}}>🛒</div>
        <div style={{fontSize:13,color:"#FFF",fontWeight:600}}>Lista de compras</div>
        <div style={{fontSize:10,color:plan?.shoppingList?"#2ECC71":"#666"}}>{plan?.shoppingList?"Ver lista":"Requiere plan"}</div>
      </button>
    </div>
    <button onClick={()=>setView("objetivos")} style={{...S.cd,width:"100%",textAlign:"left",cursor:"pointer",display:"block",marginBottom:16,borderLeft:"3px solid "+bloqueAct.c}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontSize:20}}>{bloqueAct.i}</span>
          <div><div style={{fontSize:13.5,color:"#FFF",fontWeight:600}}>Objetivos · {bloqueAct.l}</div>
          <div style={{fontSize:11,color:"#888",marginTop:2}}>{semBl?"Semana "+semBl+" del bloque":"Definí desde cuándo"} · {totalKcal} kcal hoy</div></div>
        </div>
        {avisoBl?<span style={{fontSize:11,color:"#F39C12",fontWeight:700}}>{"\u26A0\uFE0F"}</span>:<span style={{fontSize:16,color:bloqueAct.c}}>{"\u2192"}</span>}
      </div></button>
    <div style={{display:"flex",gap:8,marginBottom:16}}>
      <button onClick={()=>setView("add")} style={{...S.btn,flex:1,padding:"12px 16px",fontSize:14}}>+ Registrar</button>
      <button onClick={()=>setView("history")} style={{...S.sm,padding:"12px 14px",fontSize:12,color:"#AAA"}}>📅</button>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
      <h3 style={{...S.t1,fontSize:14,margin:0}}>Hoy — {fd(td())}</h3>
      <span style={{fontSize:11,color:LD.c,fontWeight:600}}>{LD.i} {LD.l}</span>
    </div>
    {hasMacros
      ? <div style={{...S.cd,marginBottom:12}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <span style={{fontSize:11,color:"#888",fontFamily:"'Oswald',sans-serif",letterSpacing:1}}>MACROS DEL DÍA</span>
            <span style={{fontSize:10,color:"#555"}}>{weightKgHome}kg · {queToca}</span>
          </div>
          <MacroBar label="PROTEÍNA" current={todayP} target={targP} color="#2ECC71"/>
          <MacroBar label="CARBOS" current={todayC} target={targC} color="#3498DB"/>
          <MacroBar label="GRASA" current={todayF} target={targF} color="#E67E22"/>
          {todayK>0&&<div style={{display:"flex",justifyContent:"space-between",marginTop:6,paddingTop:8,borderTop:"1px solid rgba(255,255,255,0.06)"}}>
            <span style={{fontSize:11,color:"#666"}}>Calorías registradas</span>
            <span style={{fontSize:12,color:"#FF6B35",fontWeight:700}}>{todayK} <span style={{color:"#555"}}>/ ~{totalKcal} kcal</span></span>
          </div>}
        </div>
      : <div style={{...S.cd,marginBottom:12,borderLeft:"3px solid rgba(46,204,113,0.3)",background:"rgba(46,204,113,0.03)"}}>
          <p style={{fontSize:11,color:"#888",margin:0,lineHeight:1.5}}>
            💡 Obj. de hoy ({LD.l.toLowerCase()} — {queToca}): <span style={{color:"#2ECC71",fontWeight:700}}>{targP}g P</span> · <span style={{color:"#3498DB",fontWeight:700}}>{targC}g C</span> · <span style={{color:"#E67E22",fontWeight:700}}>{targF}g G</span> · <span style={{color:"#FF6B35",fontWeight:700}}>~{totalKcal} kcal</span>
          </p>
        </div>
    }
    <MealList meals={todayMeals}/>
    {todayMeals.length===0&&<div style={{...S.cd,borderLeft:"3px solid #9B59B6",background:"rgba(155,89,182,0.06)"}}>
      <p style={{fontSize:12,color:"#CCC",lineHeight:1.5,margin:0}}>Registrá tus comidas con macros para ver el progreso hacia el objetivo del día.</p>
    </div>}
  </div>;
}

// ─── APP ───
function App(){
  const[data,setData]=useState(EMPTY);const[tab,setTab]=useState("today");const[modoTrain,setModoTrain]=useState(null);const[loading,setLoading]=useState(true);const[apiKey,setAK]=useState("");
  useEffect(()=>{const d=ld();if(d){if(!d.anthropometry)d.anthropometry=[];if(d.phase===undefined)d.phase=0;if(!d.planNotes)d.planNotes=[];if(!d.cardioSessions)d.cardioSessions=[];if(!d.coachNotes)d.coachNotes=[];if(!d.meals)d.meals=[];if(!d.weeklyNutrPlan)d.weeklyNutrPlan=null;if(!d.healthStudies)d.healthStudies=[];setData(d)}setAK(gk());setLoading(false)},[]);
  // Si la sync esta activa, avisa cuando Drive tiene algo mas nuevo que este dispositivo
  const[gdNuevo,setGdNuevo]=useState(false);
  useEffect(()=>{
    if(loading||!GD.cfg().auto)return;
    let vivo=true;
    const t=setTimeout(async()=>{
      try{
        const rt=await GD.remoteTime();
        const local=GD.cfg().last;
        if(vivo&&rt&&local&&new Date(rt).getTime()>new Date(local).getTime()+5000)setGdNuevo(true);
      }catch(e){}
    },2500);
    return ()=>{vivo=false;clearTimeout(t)};
  },[loading]);
  const traerDeDrive=async()=>{
    try{
      const nd=await GD.pull();
      const st=bkStats(nd);
      const resumen=Object.keys(st).map(k=>st[k]+" "+k.toLowerCase()).join(", ");
      if(window.confirm("En Drive hay: "+resumen+".\n\nEsto REEMPLAZA los datos de este dispositivo. ¿Seguir?")){
        sv(nd);setData(nd);window.location.reload();
      }else setGdNuevo(false);
    }catch(e){window.alert("No se pudo traer de Drive: "+(e.message||""));setGdNuevo(false)}
  };
  const handleKey=k=>{setAK(k);stk(k)};
  if(loading)return <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",minHeight:"100vh",background:"#0A0A0B"}}><Logo size={64}/><h1 style={{fontFamily:"'Oswald',sans-serif",fontSize:28,color:"#FFF",margin:"16px 0 0"}}>FORJA</h1></div>;
  return <div style={S.app}>
    {gdNuevo&&<div style={{position:"sticky",top:0,zIndex:90,background:"linear-gradient(135deg,#4285F4,#2B62C7)",padding:"10px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>
      <span style={{fontSize:12,color:"#FFF",lineHeight:1.4}}>Hay datos más nuevos en Drive</span>
      <span style={{display:"flex",gap:6,flexShrink:0}}>
        <button onClick={traerDeDrive} style={{background:"rgba(255,255,255,0.9)",color:"#2B62C7",border:"none",borderRadius:8,padding:"6px 12px",fontSize:12,fontWeight:700,cursor:"pointer"}}>Traer</button>
        <button onClick={()=>setGdNuevo(false)} style={{background:"none",color:"rgba(255,255,255,0.85)",border:"none",fontSize:16,cursor:"pointer",padding:"0 4px"}}>{"×"}</button>
      </span>
    </div>}
    <div style={S.hdr}><div style={{display:"flex",alignItems:"center",gap:10}}><Logo size={32}/><span style={{fontFamily:"'Oswald',sans-serif",fontSize:22,fontWeight:700,letterSpacing:3,color:"#FFF"}}>FORJA</span></div><span style={{fontSize:10,color:"#666",fontFamily:"'Oswald',sans-serif",letterSpacing:2}}>ENTRENA CON CIENCIA</span></div>
    <div style={S.cnt}>
      {tab==="today"&&<TodayTab data={data} onGo={(t,m)=>{setModoTrain(m||null);setTab(t)}}/>}
      {tab==="plan"&&<PlanTab data={data} setData={setData}/>}
      {tab==="train"&&<TrainTab data={data} setData={setData} apiKey={apiKey} modo={modoTrain} setModo={setModoTrain}/>}
      {tab==="nutrition"&&<NutritionTab data={data} setData={setData} apiKey={apiKey}/>}
      {tab==="body"&&<BodyTab data={data} setData={setData} apiKey={apiKey}/>}
      {tab==="progress"&&<ProgressTab data={data}/>}
      {tab==="settings"&&<SettingsTab apiKey={apiKey} onApiKeyChange={handleKey} data={data} setData={setData}/>}
    </div>
    <TabBar active={tab} onChange={setTab}/>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
